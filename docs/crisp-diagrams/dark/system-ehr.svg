<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-label="The patient record system is the hub every clinical system exchanges data with">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--key-fill:#1e2f45;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="system-ehr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">The patient record system is the hub every clinical system exchanges data with</text>
  <text class="note" x="24" y="54">System context for a hospital's electronic health record</text>
  <rect class="box violet" x="24" y="80" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 91) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="66" y="104">Doctors</text>
  <text class="note" x="66" y="120">Write notes and</text>
  <text class="note" x="66" y="136">orders</text>
  <rect class="box violet" x="24" y="176" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 187) scale(0.833333)"><rect x="5.5" y="4.5" width="13" height="16.5" rx="1.5"/><rect x="9" y="3" width="6" height="3" rx="1"/><path d="M9 11h6M9 15h4"/></g>
  <text class="name" x="66" y="200">Nurses</text>
  <text class="note" x="66" y="216">Record care</text>
  <rect class="box violet" x="24" y="272" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 283) scale(0.833333)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></g>
  <text class="name" x="66" y="296">Patients</text>
  <text class="note" x="66" y="312">Through the portal</text>
  <rect class="box green" x="560" y="80" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 91) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="602" y="104">Lab system</text>
  <text class="note" x="602" y="120">Test results</text>
  <rect class="box green" x="560" y="176" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 187) scale(0.833333)"><path d="M4 9.5V20h16V9.5M3 9.5l2-5.5h14l2 5.5zM9.5 20v-5h5v5"/></g>
  <text class="name" x="602" y="200">Pharmacy</text>
  <text class="note" x="602" y="216">Prescriptions</text>
  <rect class="box green" x="560" y="272" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 283) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="602" y="296">Insurer</text>
  <text class="note" x="602" y="312">Claims</text>
  <rect class="key" x="296" y="80" width="168" height="264" rx="8"/>
  <g class="icon accent" transform="translate(370 163) scale(1.16667)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g>
  <text class="name mid" x="380" y="209">Patient records</text>
  <text class="small mid" x="380" y="225">One record per patient,</text>
  <text class="small mid" x="380" y="241">shared across the</text>
  <text class="small mid" x="380" y="257">hospital</text>
  <g class="line"><path d="M200 116H296" marker-end="url(#system-ehr-arrow)" marker-start="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="248" y="108">updates</text>
  <g class="line"><path d="M200 212H296" marker-end="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="248" y="204">records</text>
  <g class="line"><path d="M200 308H296" marker-end="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="248" y="300">views</text>
  <g class="line"><path d="M560 116H464" marker-end="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="512" y="108">results</text>
  <g class="line"><path d="M464 212H560" marker-end="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="512" y="204">orders</text>
  <g class="line"><path d="M464 308H560" marker-end="url(#system-ehr-arrow)"/></g>
  <text class="note mid" x="512" y="300">claims</text>
</svg>
