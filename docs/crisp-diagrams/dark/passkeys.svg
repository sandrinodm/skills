<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Passkeys leave nothing on the server worth stealing">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="passkeys-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Passkeys leave nothing on the server worth stealing</text>
  <text class="note" x="24" y="54">Passwords and passkeys compared, from the user's side and the server's</text>
  <rect class="box rose" x="24" y="72" width="344" height="254" rx="8"/>
  <text class="name" x="40" y="96">Passwords</text>
  <text class="note" x="40" y="112">Something you know</text>
  <rect class="box teal" x="392" y="72" width="344" height="254" rx="8"/>
  <text class="name" x="408" y="96">Passkeys</text>
  <text class="note" x="408" y="112">A key pair on your device</text>
  <text class="note" x="40" y="144">What the server stores</text>
  <text class="small" x="40" y="162">A hash of the password</text>
  <text class="note" x="408" y="144">What the server stores</text>
  <text class="small" x="408" y="162">A public key</text>
  <text class="note" x="40" y="192">Phishing</text>
  <text class="small" x="40" y="210">You can type it into a fake site</text>
  <text class="note" x="408" y="192">Phishing</text>
  <text class="small" x="408" y="210">Bound to the real site's domain</text>
  <text class="note" x="40" y="240">Reuse across sites</text>
  <text class="small" x="40" y="258">Common, so one breach spreads</text>
  <text class="note" x="408" y="240">Reuse across sites</text>
  <text class="small" x="408" y="258">A new key pair for every site</text>
  <text class="note" x="40" y="288">Signing in</text>
  <text class="small" x="40" y="306">Type it, then a second factor</text>
  <text class="note" x="408" y="288">Signing in</text>
  <text class="small" x="408" y="306">Face, fingerprint or device PIN</text>
  <rect class="key" x="24" y="350" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="372">If the server is breached</text>
  <text class="small" x="40" y="392">Hashes can be cracked offline</text>
  <text class="small" x="408" y="392">Public keys are useless to an attacker</text>
</svg>
