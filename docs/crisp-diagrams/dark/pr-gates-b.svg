<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-label="A pull request passes three checks before it reaches every user">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="pr-gates-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A pull request passes three checks before it reaches every user</text>
  <text class="note" x="24" y="54">Our path from a pull request to production</text>
  <rect class="box teal" x="24" y="76" width="160" height="108" rx="8"/>
  <rect class="badge teal" x="36" y="88" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(42 94) scale(0.833333)"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/></g>
  <text class="name" x="36" y="140">Pull request</text>
  <text class="note" x="36" y="156">Small change, linked</text>
  <text class="note" x="36" y="172">to an issue</text>
  <rect class="box teal" x="208" y="76" width="160" height="108" rx="8"/>
  <rect class="badge teal" x="220" y="88" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(226 94) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="220" y="140">Automated checks</text>
  <text class="note" x="220" y="156">Tests, lint and a</text>
  <text class="note" x="220" y="172">security scan</text>
  <g class="line"><path d="M184 130H208" marker-end="url(#pr-gates-b-arrow)"/></g>
  <rect class="box teal" x="392" y="76" width="160" height="108" rx="8"/>
  <rect class="badge teal" x="404" y="88" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(410 94) scale(0.833333)"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/></g>
  <text class="name" x="404" y="140">Code review</text>
  <text class="note" x="404" y="156">One approval from a</text>
  <text class="note" x="404" y="172">code owner</text>
  <g class="line"><path d="M368 130H392" marker-end="url(#pr-gates-b-arrow)"/></g>
  <rect class="key" x="576" y="76" width="160" height="108" rx="8"/>
  <g class="icon accent" transform="translate(594 94) scale(0.833333)"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></g>
  <text class="name" x="588" y="140">Canary release</text>
  <text class="note" x="588" y="156">5% of traffic for an</text>
  <text class="note" x="588" y="172">hour, then all</text>
  <g class="line"><path d="M552 130H576" marker-end="url(#pr-gates-b-arrow)"/></g>
  <g class="line"><path d="M288 184V248" marker-end="url(#pr-gates-b-arrow)"/></g>
  <text class="note" x="296" y="204">a check fails</text>
  <rect class="box rose" x="208" y="248" width="160" height="92" rx="8"/>
  <rect class="badge rose" x="220" y="260" width="32" height="32" rx="9"/><g class="icon rose" transform="translate(226 266) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="220" y="312">Back to the author</text>
  <text class="note" x="220" y="328">With the failing check</text>
  <g class="line"><path d="M208 294H104V184" marker-end="url(#pr-gates-b-arrow)"/></g>
  <rect class="callout" x="24" y="372" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="394">Rollback is automatic</text>
  <text class="small" x="40" y="414">If error rates rise during the canary, the release stops and rolls back on its own</text>
</svg>
