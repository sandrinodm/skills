<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-label="Build the agent guard, buy everything around it">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="wardley-identity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Build the agent guard, buy everything around it</text>
  <text class="note" x="24" y="54">Where each part of our sign-in stack sits on the path to commodity</text>
  <g class="line"><path d="M136 448V84" marker-end="url(#wardley-identity-arrow)"/></g>
  <g class="line"><path d="M136 448H736" marker-end="url(#wardley-identity-arrow)"/></g>
  <text class="note mid" x="211" y="468">Genesis</text>
  <text class="note mid" x="361" y="468">Custom-built</text>
  <text class="note mid" x="511" y="468">Product</text>
  <text class="note mid" x="661" y="468">Commodity</text>
  <text class="name end" x="736" y="488">Evolution</text>
  <text class="note end" x="124" y="96">Visible</text>
  <text class="note end" x="124" y="448">Invisible</text>
  <text class="name end" x="124" y="272">Value chain</text>
  <g class="line"><path d="M495.386 108.465L399.014 163.535"/></g>
  <g class="line"><path d="M382.961 171.622L255.67 227.574"/></g>
  <g class="line"><path d="M398.033 173.857L473.967 238.943"/></g>
  <g class="line"><path d="M487.317 251.007L541.483 302.593"/></g>
  <g class="line"><path d="M255.811 236.092L668.446 401.452"/></g>
  <g class="line"><path d="M555.216 314.178L669.584 399.422"/></g>
  <g class="life"><path d="M490.8 244.8H604" marker-end="url(#wardley-identity-arrow)"/></g>
  <circle class="box violet" cx="503.2" cy="104" r="6"/>
  <text class="small" x="443.2" y="91">Customers signing in</text>
  <circle class="box teal" cx="391.2" cy="168" r="6"/>
  <text class="small" x="285.2" y="155">Login experience</text>
  <circle class="key" cx="245.6" cy="232" r="8"/>
  <text class="small strong" x="162.3" y="236">Agent guard</text>
  <circle class="box teal" cx="480.8" cy="244.8" r="6"/>
  <text class="small" x="490.8" y="231.8">Passkeys</text>
  <circle class="box teal" cx="548" cy="308.8" r="6"/>
  <text class="small" x="562" y="312.8">Identity provider</text>
  <circle class="box teal" cx="676.8" cy="404.8" r="6"/>
  <text class="small" x="637.8" y="430.8">Cloud compute</text>
  <g class="life"><path d="M286 88V138"/></g>
  <g class="life"><path d="M286 159V448"/></g>
  <g class="life"><path d="M436 88V448"/></g>
  <g class="life"><path d="M586 88V295.8"/></g>
  <g class="life"><path d="M586 316.8V448"/></g>
</svg>
