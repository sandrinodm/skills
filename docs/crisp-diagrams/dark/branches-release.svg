<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" role="img" aria-label="A fix lands on the release branch first, then flows back to main">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="branches-release-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A fix lands on the release branch first, then flows back to main</text>
  <text class="note" x="24" y="54">Release branches with a hotfix</text>
  <text class="small code" x="24" y="108">main</text>
  <text class="small code" x="24" y="192">release/2.1</text>
  <text class="small code" x="24" y="276">hotfix/login</text>
  <g class="line"><path d="M160 104H692"/></g>
  <g class="line"><path d="M236 111V188H540"/></g>
  <g class="line"><path d="M312 195V272H464"/></g>
  <g class="line"><path d="M471 272H540V199" marker-end="url(#branches-release-arrow)"/></g>
  <g class="line"><path d="M547 188H616V113" marker-end="url(#branches-release-arrow)"/></g>
  <circle class="box teal" cx="160" cy="104" r="7"/>
  <text class="note mid" x="160" y="88">feature A</text>
  <circle class="box teal" cx="236" cy="104" r="7"/>
  <text class="note mid" x="236" y="88">feature B</text>
  <circle class="box violet" cx="312" cy="188" r="7"/>
  <text class="note mid" x="312" y="172">cut 2.1</text>
  <rect class="chip amber" x="281" y="134" width="62" height="22" rx="11"/>
  <text class="small code mid" x="312" y="149">v2.1.0</text>
  <circle class="box teal" cx="388" cy="104" r="7"/>
  <text class="note mid" x="388" y="88">feature C</text>
  <circle class="box rose" cx="464" cy="272" r="7"/>
  <text class="note mid" x="464" y="256">fix login</text>
  <circle class="key" cx="540" cy="188" r="9"/>
  <text class="small strong mid" x="540" y="172">merge fix</text>
  <rect class="chip amber" x="509" y="134" width="62" height="22" rx="11"/>
  <text class="small code mid" x="540" y="149">v2.1.1</text>
  <circle class="box teal" cx="616" cy="104" r="7"/>
  <text class="note mid" x="616" y="88">back to main</text>
  <circle class="box teal" cx="692" cy="104" r="7"/>
  <text class="note mid" x="692" y="88">feature D</text>
</svg>
