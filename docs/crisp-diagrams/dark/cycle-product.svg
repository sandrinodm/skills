<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-label="Each turn of the loop should take days, not months">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="cycle-product-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Each turn of the loop should take days, not months</text>
  <text class="note" x="24" y="54">The product feedback loop</text>
  <rect class="box teal" x="24" y="80" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="36" y="92" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(42 98) scale(0.833333)"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></g>
  <text class="name" x="80" y="104">Ship</text>
  <text class="note" x="80" y="120">Release a small change</text>
  <text class="note" x="80" y="136">to some users</text>
  <rect class="key" x="520" y="80" width="216" height="72" rx="8"/>
  <g class="icon accent" transform="translate(538 98) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="576" y="104">Measure</text>
  <text class="note" x="576" y="120">Watch the numbers that</text>
  <text class="note" x="576" y="136">matter</text>
  <rect class="box teal" x="520" y="316" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="532" y="328" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(538 334) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="576" y="340">Learn</text>
  <text class="note" x="576" y="356">Talk to users about what</text>
  <text class="note" x="576" y="372">changed</text>
  <rect class="box teal" x="24" y="316" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="36" y="328" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(42 334) scale(0.833333)"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></g>
  <text class="name" x="80" y="340">Decide</text>
  <text class="note" x="80" y="356">Keep, change or roll</text>
  <text class="note" x="80" y="372">back</text>
  <g class="icon" transform="translate(366 188) scale(1.16667)"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5M20 20v-4h-4"/></g>
  <text class="name mid" x="380" y="234">Build, measure, learn</text>
  <text class="note mid" x="380" y="252">Small releases make every turn cheap</text>
  <g class="line"><path d="M240 116H520" marker-end="url(#cycle-product-arrow)"/></g>
  <g class="line"><path d="M628 152V316" marker-end="url(#cycle-product-arrow)"/></g>
  <g class="line"><path d="M520 352H240" marker-end="url(#cycle-product-arrow)"/></g>
  <g class="line"><path d="M132 316V152" marker-end="url(#cycle-product-arrow)"/></g>
</svg>
