<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-label="Code reaches production only through the pipeline&#x27;s release gate">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="icons-ci-platform-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Code reaches production only through the pipeline's release gate</text>
  <text class="note" x="24" y="54">The parts of a build-and-deploy platform</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="258" y="100">Developers</text>
  <text class="note" x="258" y="116">Push commits and open pull requests</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#icons-ci-platform-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#icons-ci-platform-arrow)"/></g>
  <text class="note end" x="332" y="156">commits</text>
  <text class="note" x="428" y="156">build results</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="272" rx="8"/>
  <text class="name" x="40" y="196">Delivery pipeline</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 223) scale(0.833333)"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7.5v9M18 10c0 3-3 4-7 4.5-2.5.3-4 1-5 2.5"/></g>
  <text class="name" x="82" y="236">Repository</text>
  <text class="note" x="82" y="252">Source code, branches and</text>
  <text class="note" x="82" y="268">history</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 223) scale(0.833333)"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g>
  <text class="name" x="314" y="236">Build</text>
  <text class="note" x="314" y="252">Compiles and packages each</text>
  <text class="note" x="314" y="268">commit</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 223) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5.5-6"/></g>
  <text class="name" x="546" y="236">Tests</text>
  <text class="note" x="546" y="252">Unit, integration and</text>
  <text class="note" x="546" y="268">end-to-end suites</text>
  <rect class="box teal" x="40" y="300" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 311) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="82" y="324">Security scan</text>
  <text class="note" x="82" y="340">Dependencies and secrets in</text>
  <text class="note" x="82" y="356">the code</text>
  <rect class="box teal" x="272" y="300" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 311) scale(0.833333)"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></g>
  <text class="name" x="314" y="324">Artifact store</text>
  <text class="note" x="314" y="340">Signed builds, ready to</text>
  <text class="note" x="314" y="356">deploy</text>
  <rect class="box teal" x="504" y="300" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 311) scale(0.833333)"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></g>
  <text class="name" x="546" y="324">Deploy</text>
  <text class="note" x="546" y="340">Rolls out in small steps</text>
  <rect class="key" x="40" y="388" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 398) scale(0.833333)"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></g>
  <text class="name" x="82" y="412">Release gate</text>
  <text x="180" y="412">a green build plus one approval, or nothing ships</text>
  <g class="line"><path d="M132 428V492" marker-end="url(#icons-ci-platform-arrow)"/></g>
  <rect class="box green" x="24" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(36 503) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="66" y="516">Staging</text>
  <text class="note" x="66" y="532">Where every build lands</text>
  <text class="note" x="66" y="548">first</text>
  <g class="line"><path d="M380 428V492" marker-end="url(#icons-ci-platform-arrow)"/></g>
  <rect class="box green" x="272" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(284 503) scale(0.833333)"><path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></g>
  <text class="name" x="314" y="516">Production</text>
  <text class="note" x="314" y="532">Gets only approved builds</text>
  <g class="line"><path d="M628 428V492" marker-end="url(#icons-ci-platform-arrow)"/></g>
  <rect class="box green" x="520" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(532 503) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="562" y="516">Monitoring</text>
  <text class="note" x="562" y="532">Watches errors after each</text>
  <text class="note" x="562" y="548">release</text>
  <text class="note" x="388" y="472">approved releases</text>
</svg>
