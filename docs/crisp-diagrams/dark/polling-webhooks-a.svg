<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-label="Webhooks deliver events in seconds; polling wastes most of its calls">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="polling-webhooks-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Webhooks deliver events in seconds; polling wastes most of its calls</text>
  <text class="note" x="24" y="54">Two ways to find out that something changed in another system</text>
  <rect class="box amber" x="24" y="72" width="344" height="270" rx="8"/>
  <rect class="badge amber" x="40" y="86" width="32" height="32" rx="9"/><g class="icon amber" transform="translate(46 92) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="84" y="98">Polling</text>
  <text class="note" x="84" y="114">You ask every minute</text>
  <rect class="box teal" x="392" y="72" width="344" height="270" rx="8"/>
  <rect class="badge teal" x="408" y="86" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(414 92) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="452" y="98">Webhooks</text>
  <text class="note" x="452" y="114">The other system calls you</text>
  <text class="note" x="40" y="160">Delay</text>
  <text class="small" x="40" y="178">Up to the polling interval</text>
  <text class="note" x="408" y="160">Delay</text>
  <text class="small" x="408" y="178">Usually seconds</text>
  <text class="note" x="40" y="208">Wasted calls</text>
  <text class="small" x="40" y="226">Most calls return nothing new</text>
  <text class="note" x="408" y="208">Wasted calls</text>
  <text class="small" x="408" y="226">None</text>
  <text class="note" x="40" y="256">When something fails</text>
  <text class="small" x="40" y="274">Just poll again</text>
  <text class="note" x="408" y="256">When something fails</text>
  <text class="small" x="408" y="274">The sender retries; you verify signatures</text>
  <text class="note" x="40" y="304">Network</text>
  <text class="small" x="40" y="322">Outbound calls only</text>
  <text class="note" x="408" y="304">Network</text>
  <text class="small" x="408" y="322">You need a public endpoint</text>
  <rect class="key" x="24" y="366" width="712" height="56" rx="8"/>
  <g class="icon accent" transform="translate(704 384) scale(0.833333)"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></g>
  <text class="name" x="40" y="388">Choose it when</text>
  <text class="small" x="40" y="408">You can't expose an endpoint</text>
  <text class="small" x="408" y="408">Events matter in real time</text>
</svg>
