  <defs>
    <marker id="mcp-authorization-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A remote MCP server asks for a token, never for the user's password</text>
  <text class="note" x="24" y="54">How an MCP client gets authorized for a remote MCP server, following the MCP authorization spec</text>
  <g class="life"><line x1="88" x2="88" y1="148" y2="556"/></g>
  <g class="life"><line x1="234" x2="234" y1="148" y2="556"/></g>
  <g class="life"><line x1="380" x2="380" y1="148" y2="556"/></g>
  <g class="life"><line x1="526" x2="526" y1="148" y2="556"/></g>
  <g class="life"><line x1="672" x2="672" y1="148" y2="556"/></g>
  <rect class="box violet" x="24" y="72" width="128" height="76" rx="8"/>
  <g class="icon violet" transform="translate(78 82) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name mid" x="88" y="118">User</text>
  <text class="note mid" x="88" y="136">approves access</text>
  <rect class="box teal" x="170" y="72" width="128" height="76" rx="8"/>
  <g class="icon teal" transform="translate(224 82) scale(0.833333)"><path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/></g>
  <text class="name mid" x="234" y="118">MCP client</text>
  <text class="note mid" x="234" y="136">for example, Claude</text>
  <rect class="box amber" x="316" y="72" width="128" height="76" rx="8"/>
  <g class="icon amber" transform="translate(370 82) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name mid" x="380" y="118">MCP server</text>
  <text class="note mid" x="380" y="136">a remote server</text>
  <rect class="box rose" x="462" y="72" width="128" height="76" rx="8"/>
  <g class="icon rose" transform="translate(516 82) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name mid" x="526" y="118">Auth server</text>
  <text class="note mid" x="526" y="136">issues tokens</text>
  <rect class="box green" x="608" y="72" width="128" height="76" rx="8"/>
  <g class="icon green" transform="translate(662 82) scale(0.833333)"><path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></g>
  <text class="name mid" x="672" y="118">SaaS API</text>
  <text class="note mid" x="672" y="136">behind the server</text>
  <g class="line"><path d="M234 196H378" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small mid" x="307" y="188">1 Calls a tool</text>
  <g class="line"><path d="M380 244H236" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small mid" x="307" y="236">2 401, with metadata</text>
  <g class="line"><path d="M234 292H524" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small" x="246" y="284">3 Starts OAuth with PKCE</text>
  <g class="line"><path d="M88 340H524" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small" x="100" y="332">4 Signs in and consents</text>
  <g class="line"><path d="M526 388H236" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small end" x="514" y="380">5 Token for this server</text>
  <g class="line"><path d="M234 436H378" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small mid" x="307" y="428">6 Calls the tool again</text>
  <rect class="key" x="270" y="452" width="220" height="48" rx="8"/>
  <text class="small strong mid" x="380" y="472">7 Checks the token</text>
  <text class="small mid" x="380" y="488">its audience must be this server</text>
  <g class="line"><path d="M380 532H670" marker-end="url(#mcp-authorization-a-arrow)"/></g>
  <text class="small" x="392" y="524">8 Calls the API</text>
  <rect class="callout" x="24" y="576" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="598">One token per server</text>
  <text class="small" x="40" y="618">Tokens are bound to one MCP server, so a compromised server can't replay them against another</text>
</svg>
