  <rect class="key" x="24" y="408" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="430">Proof of approval travels with every payment</text>
  <text class="small" x="40" y="450">A signed mandate or token shows the merchant and the network that the user said yes</text>
