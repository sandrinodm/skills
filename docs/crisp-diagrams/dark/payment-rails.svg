  <text class="small mid" x="335.5" y="161">Wallet limits</text>
  <g class="line"><path d="M176 144H208" marker-end="url(#payment-rails-arrow)"/></g>
  <g class="line"><path d="M552 144H584" marker-end="url(#payment-rails-arrow)"/></g>
