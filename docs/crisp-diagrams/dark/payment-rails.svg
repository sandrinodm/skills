  <text class="small mid" x="383" y="257">Mastercard Agent Pay</text>
  <g class="line"><path d="M176 240H208" marker-end="url(#payment-rails-arrow)"/></g>
  <g class="line"><path d="M552 240H584" marker-end="url(#payment-rails-arrow)"/></g>
  <rect class="box amber" x="208" y="296" width="344" height="80" rx="8"/>
  <text class="name" x="224" y="320">Rail 3: bank transfers</text>
  <rect class="chip amber" x="224" y="336" width="101" height="26" rx="13"/>
