<svg xmlns="http://www.w3.org/2000/svg" width="760" height="343" viewBox="0 0 760 343" role="img" aria-label="Agent payments go from a five-merchant pilot to general availability in a year">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="timeline-roadmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Agent payments go from a five-merchant pilot to general availability in a year</text>
  <text class="note" x="24" y="54">Roadmap for launching agent checkout</text>
  <rect class="box violet" x="42" y="104" width="217" height="28" rx="14"/>
  <text class="small" x="56" y="122">Design and pilot</text>
  <rect class="box teal" x="246" y="144" width="234" height="28" rx="14"/>
  <text class="small" x="260" y="162">Merchant beta</text>
  <rect class="box green" x="484" y="104" width="234" height="28" rx="14"/>
  <text class="small" x="498" y="122">General availability</text>
  <text class="note mid" x="125" y="202">Q1</text>
  <text class="note mid" x="295" y="202">Q2</text>
  <text class="note mid" x="465" y="202">Q3</text>
  <text class="note mid" x="635" y="202">Q4</text>
  <g class="line"><path d="M40 220H720"/></g>
  <g class="line"><path d="M40 215V225"/></g>
  <g class="line"><path d="M210 215V225"/></g>
  <g class="line"><path d="M380 215V225"/></g>
  <g class="line"><path d="M550 215V225"/></g>
  <g class="line"><path d="M720 215V225"/></g>
  <g class="life"><line x1="227" x2="227" y1="94" y2="220"/></g>
  <text class="note mid" x="227" y="88">Today</text>
  <g class="line"><path d="M108 229V246"/></g>
  <circle class="btn" cx="108" cy="220" r="5"/>
  <text class="small strong mid" x="108" y="260">Pilot live</text>
  <text class="note mid" x="108" y="275">February</text>
  <g class="line"><path d="M278 229V286"/></g>
  <circle class="btn" cx="278" cy="220" r="5"/>
  <text class="small strong mid" x="278" y="300">Beta opens</text>
  <text class="note mid" x="278" y="315">May</text>
  <g class="line"><path d="M482 229V246"/></g>
  <rect class="key" x="473" y="211" width="18" height="18" rx="9"/>
  <text class="small strong mid" x="482" y="260">GA launch</text>
  <text class="note mid" x="482" y="275">August</text>
  <g class="line"><path d="M652 229V286"/></g>
  <circle class="btn" cx="652" cy="220" r="5"/>
  <text class="small strong mid" x="652" y="300">EU rollout</text>
  <text class="note mid" x="652" y="315">November</text>
</svg>
