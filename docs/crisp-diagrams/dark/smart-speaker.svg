<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-label="A smart speaker listens on the device, and audio leaves only after the wake word">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="smart-speaker-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A smart speaker listens on the device, and audio leaves only after the wake word</text>
  <text class="note" x="24" y="54">What runs inside a voice assistant speaker, and what it reaches</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <text class="name mid" x="380" y="100">You, anywhere in the room</text>
  <text class="note mid" x="380" y="116">Talk to it, or press the mute button</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#smart-speaker-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#smart-speaker-arrow)"/></g>
  <text class="note end" x="332" y="156">speech</text>
  <text class="note" x="428" y="156">answers and music</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="272" rx="8"/>
  <text class="name" x="40" y="196">On the speaker itself</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="52" y="236">Microphones</text>
  <text class="note" x="52" y="252">Seven mics that hear the whole</text>
  <text class="note" x="52" y="268">room</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="236">Wake-word detector</text>
  <text class="note" x="284" y="252">Listens for its name, on the</text>
  <text class="note" x="284" y="268">device</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="516" y="236">Local controls</text>
  <text class="note" x="516" y="252">Volume, timers and the mute</text>
  <text class="note" x="516" y="268">switch</text>
  <rect class="box teal" x="40" y="300" width="216" height="72" rx="8"/>
  <text class="name" x="52" y="324">Speaker</text>
  <text class="note" x="52" y="340">Plays answers, music and alarms</text>
  <rect class="box teal" x="272" y="300" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="324">Short buffer</text>
  <text class="note" x="284" y="340">Keeps one second of audio, then</text>
  <text class="note" x="284" y="356">drops it</text>
  <rect class="box teal" x="504" y="300" width="216" height="72" rx="8"/>
  <text class="name" x="516" y="324">Settings</text>
  <text class="note" x="516" y="340">Your rooms, devices and</text>
  <text class="note" x="516" y="356">preferences</text>
  <rect class="key" x="40" y="388" width="680" height="40" rx="8"/>
  <text class="name" x="56" y="412">Privacy gate</text>
  <text x="154" y="412">audio leaves the speaker only after the wake word</text>
  <g class="line"><path d="M132 428V492" marker-end="url(#smart-speaker-arrow)"/></g>
  <rect class="box green" x="24" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="36" y="516">Voice assistant</text>
  <text class="note" x="36" y="532">Understands the request in the</text>
  <text class="note" x="36" y="548">cloud</text>
  <g class="line"><path d="M380 428V492" marker-end="url(#smart-speaker-arrow)"/></g>
  <rect class="box green" x="272" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="516">Music services</text>
  <text class="note" x="284" y="532">Stream the song you asked for</text>
  <g class="line"><path d="M628 428V492" marker-end="url(#smart-speaker-arrow)"/></g>
  <rect class="box green" x="520" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="532" y="516">Smart home</text>
  <text class="note" x="532" y="532">Lights, plugs and thermostats</text>
  <text class="note" x="388" y="472">after the wake word only</text>
</svg>
