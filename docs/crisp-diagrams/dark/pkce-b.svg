<svg xmlns="http://www.w3.org/2000/svg" width="760" height="608" viewBox="0 0 760 608" role="img" aria-label="With PKCE, a stolen authorization code is useless without the verifier">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="pkce-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">With PKCE, a stolen authorization code is useless without the verifier</text>
  <text class="note" x="24" y="54">OAuth 2.0 authorization code flow with PKCE, for apps that can't keep a secret</text>
  <g class="life"><line x1="104" x2="104" y1="148" y2="508"/></g>
  <g class="life"><line x1="288" x2="288" y1="148" y2="508"/></g>
  <g class="life"><line x1="472" x2="472" y1="148" y2="508"/></g>
  <g class="life"><line x1="656" x2="656" y1="148" y2="508"/></g>
  <rect class="box violet" x="24" y="72" width="160" height="76" rx="8"/>
  <g class="icon violet" transform="translate(94 82) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name mid" x="104" y="118">Browser</text>
  <text class="note mid" x="104" y="136">the user signs in</text>
  <rect class="box teal" x="208" y="72" width="160" height="76" rx="8"/>
  <g class="icon teal" transform="translate(278 82) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name mid" x="288" y="118">Your app</text>
  <text class="note mid" x="288" y="136">makes a secret verifier</text>
  <rect class="box amber" x="392" y="72" width="160" height="76" rx="8"/>
  <g class="icon amber" transform="translate(462 82) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name mid" x="472" y="118">Auth server</text>
  <text class="note mid" x="472" y="136">issues codes and tokens</text>
  <rect class="box green" x="576" y="72" width="160" height="76" rx="8"/>
  <g class="icon green" transform="translate(646 82) scale(0.833333)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="name mid" x="656" y="118">API</text>
  <text class="note mid" x="656" y="136">checks the token</text>
  <g class="line"><path d="M288 196H470" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small mid" x="380" y="188">1 Sends a hash of the verifier</text>
  <g class="line"><path d="M104 244H470" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small" x="116" y="236">2 User signs in and approves</text>
  <g class="line"><path d="M472 292H290" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small mid" x="380" y="284">3 Authorization code</text>
  <g class="line"><path d="M288 340H470" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small mid" x="380" y="332">4 Code plus the verifier</text>
  <rect class="key" x="365" y="356" width="214" height="48" rx="8"/>
  <text class="small strong mid" x="472" y="376">5 Hashes the verifier</text>
  <text class="small mid" x="472" y="392">must match the hash from step 1</text>
  <g class="line"><path d="M472 436H290" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small mid" x="380" y="428">6 Access token</text>
  <g class="line"><path d="M288 484H654" marker-end="url(#pkce-b-arrow)"/></g>
  <text class="small" x="300" y="476">7 Calls the API with the token</text>
  <rect class="callout" x="24" y="528" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="550">Why it matters</text>
  <text class="small" x="40" y="570">An attacker who intercepts the code in step 3 can't redeem it: only your app knows the verifier</text>
</svg>
