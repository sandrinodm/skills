<svg xmlns="http://www.w3.org/2000/svg" width="760" height="576" viewBox="0 0 760 576" role="img" aria-label="Customer data sits two hops from the internet, behind the app servers">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="infra-one-vpc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Customer data sits two hops from the internet, behind the app servers</text>
  <text class="note" x="24" y="54">One production network: what runs in each subnet and who can reach it</text>
  <rect class="box zone" x="24" y="168" width="712" height="384" rx="8"/>
  <g class="icon" transform="translate(38 180) scale(0.833333)"><path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></g>
  <text class="name" x="66" y="195">Production VPC</text>
  <text class="note end" x="720" y="195">10.0.0.0/16</text>
  <rect class="box zone amber" x="36" y="212" width="688" height="100" rx="8"/>
  <text class="note" x="48" y="232">Public subnet</text>
  <text class="note end" x="712" y="232">Public IPs</text>
  <rect class="box amber" x="48" y="242" width="326" height="56" rx="8"/>
  <g class="icon amber" transform="translate(60 253) scale(0.833333)"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/></g>
  <text class="name" x="90" y="266">Load balancer</text>
  <text class="note" x="90" y="282">Ends TLS</text>
  <rect class="box amber" x="386" y="242" width="326" height="56" rx="8"/>
  <g class="icon amber" transform="translate(398 253) scale(0.833333)"><path d="M21 3L3 10.5l7 3 3 7z"/><path d="M10 13.5L21 3"/></g>
  <text class="name" x="428" y="266">NAT gateway</text>
  <text class="note" x="428" y="282">Outbound calls only</text>
  <rect class="box zone teal" x="36" y="324" width="688" height="100" rx="8"/>
  <text class="note" x="48" y="344">Private subnet</text>
  <text class="note end" x="712" y="344">No public IPs</text>
  <rect class="box teal" x="48" y="354" width="326" height="56" rx="8"/>
  <g class="icon teal" transform="translate(60 365) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="90" y="378">App servers</text>
  <text class="note" x="90" y="394">Run the API</text>
  <rect class="box teal" x="386" y="354" width="326" height="56" rx="8"/>
  <g class="icon teal" transform="translate(398 365) scale(0.833333)"><path d="M5.5 5h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g>
  <text class="name" x="428" y="378">Workers</text>
  <text class="note" x="428" y="394">Background jobs</text>
  <rect class="box zone green" x="36" y="436" width="688" height="100" rx="8"/>
  <text class="note" x="48" y="456">Data subnet</text>
  <text class="note end" x="712" y="456">App tier only</text>
  <rect class="key" x="48" y="466" width="326" height="56" rx="8"/>
  <g class="icon accent" transform="translate(60 477) scale(0.833333)"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text class="name" x="90" y="490">Postgres</text>
  <text class="note" x="90" y="506">Customer data</text>
  <rect class="box green" x="386" y="466" width="326" height="56" rx="8"/>
  <g class="icon green" transform="translate(398 477) scale(0.833333)"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></g>
  <text class="name" x="428" y="490">Redis</text>
  <text class="note" x="428" y="506">Sessions and cache</text>
  <rect class="box violet" x="111" y="72" width="200" height="48" rx="8"/>
  <g class="icon violet" transform="translate(127 86) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name" x="157" y="101">Internet</text>
  <g class="line"><path d="M211 120V242" marker-end="url(#infra-one-vpc-arrow)"/></g>
  <text class="small code" x="219" y="148">HTTPS :443</text>
  <g class="line"><path d="M211 298V354" marker-end="url(#infra-one-vpc-arrow)"/></g>
  <text class="small code" x="219" y="344">HTTP :8080</text>
  <g class="line"><path d="M211 410V466" marker-end="url(#infra-one-vpc-arrow)"/></g>
  <text class="small code" x="219" y="456">:5432</text>
  <g class="line"><path d="M549 410V466" marker-end="url(#infra-one-vpc-arrow)"/></g>
  <text class="small code" x="557" y="456">:6379</text>
</svg>
