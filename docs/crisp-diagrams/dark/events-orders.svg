<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Services publish order events once, and every interested service reacts on its own">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="events-orders-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Services publish order events once, and every interested service reacts on its own</text>
  <text class="note" x="24" y="54">Event-driven architecture for an online store</text>
  <rect class="box violet" x="24" y="72" width="216" height="56" rx="8"/>
  <g class="icon violet" transform="translate(36 83) scale(0.833333)"><path d="M3 4h2.5l2.2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g>
  <text class="name" x="66" y="96">Checkout</text>
  <text class="note" x="66" y="112">Takes the order</text>
  <rect class="box violet" x="272" y="72" width="216" height="56" rx="8"/>
  <g class="icon violet" transform="translate(284 83) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="314" y="96">Payments</text>
  <text class="note" x="314" y="112">Captures the money</text>
  <rect class="box violet" x="520" y="72" width="216" height="56" rx="8"/>
  <g class="icon violet" transform="translate(532 83) scale(0.833333)"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></g>
  <text class="name" x="562" y="96">Warehouse</text>
  <text class="note" x="562" y="112">Ships the parcel</text>
  <rect class="key" x="24" y="192" width="712" height="64" rx="8"/>
  <g class="icon accent" transform="translate(40 204) scale(0.916667)"><path d="M5.5 5h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g>
  <text class="name" x="72" y="220">Event bus</text>
  <text class="small" x="72" y="238">Keeps events for 7 days, so consumers can replay them</text>
  <rect class="chip amber" x="571" y="211" width="64" height="26" rx="13"/>
  <text class="small code mid" x="603" y="228">orders</text>
  <rect class="chip amber" x="643" y="211" width="77" height="26" rx="13"/>
  <text class="small code mid" x="681.5" y="228">payments</text>
  <rect class="box green" x="24" y="320" width="166" height="56" rx="8"/>
  <g class="icon green" transform="translate(36 331) scale(0.833333)"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></g>
  <text class="name" x="66" y="344">Email</text>
  <text class="note" x="66" y="360">Sends receipts</text>
  <rect class="box green" x="206" y="320" width="166" height="56" rx="8"/>
  <g class="icon green" transform="translate(218 331) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="248" y="344">Analytics</text>
  <text class="note" x="248" y="360">Updates dashboards</text>
  <rect class="box green" x="388" y="320" width="166" height="56" rx="8"/>
  <g class="icon green" transform="translate(400 331) scale(0.833333)"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></g>
  <text class="name" x="430" y="344">Loyalty</text>
  <text class="note" x="430" y="360">Adds points</text>
  <rect class="box rose" x="570" y="320" width="166" height="56" rx="8"/>
  <g class="icon rose" transform="translate(582 331) scale(0.833333)"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.3v.2"/></g>
  <text class="name" x="612" y="344">Dead letters</text>
  <text class="note" x="612" y="360">Failed deliveries</text>
  <g class="line"><path d="M132 128V192" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code" x="140" y="164">order.placed</text>
  <g class="line"><path d="M380 128V192" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code" x="388" y="164">payment.captured</text>
  <g class="line"><path d="M628 128V192" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code end" x="620" y="164">order.shipped</text>
  <g class="line"><path d="M107 256V320" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code" x="115" y="292">on order.*</text>
  <g class="line"><path d="M289 256V320" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code" x="297" y="292">on all</text>
  <g class="line"><path d="M471 256V320" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code" x="479" y="292">on payment.*</text>
  <g class="line"><path d="M653 256V320" marker-end="url(#events-orders-arrow)"/></g>
  <text class="small code end" x="645" y="292">on failure</text>
</svg>
