  <rect class="box green" x="536" y="80" width="200" height="90" rx="8"/>
  <g class="icon green" transform="translate(548 90) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="576" y="105">Team</text>
  <g class="line"><path d="M536 118H736"/></g>
  <text class="small strong" x="548" y="135">id</text>
  <text class="note code end" x="724" y="135">uuid</text>
  <text class="small" x="548" y="157">name</text>
  <text class="note code end" x="724" y="157">text</text>
  <rect class="box teal" x="280" y="270" width="200" height="134" rx="8"/>
  <g class="icon teal" transform="translate(292 280) scale(0.833333)"><path d="M4 5.5h16v10H10l-4 3.5v-3.5H4z"/></g>
  <text class="name" x="320" y="295">Message</text>
  <g class="line"><path d="M280 308H480"/></g>
