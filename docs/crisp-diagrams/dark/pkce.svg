<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" viewBox="0 0 760 584" role="img" aria-label="With PKCE, a stolen authorization code is useless without the verifier">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="pkce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">With PKCE, a stolen authorization code is useless without the verifier</text>
  <text class="note" x="24" y="54">OAuth 2.0 authorization code flow with PKCE, for apps that can't keep a secret</text>
  <g class="life"><line x1="104" x2="104" y1="124" y2="484"/></g>
  <g class="life"><line x1="288" x2="288" y1="124" y2="484"/></g>
  <g class="life"><line x1="472" x2="472" y1="124" y2="484"/></g>
  <g class="life"><line x1="656" x2="656" y1="124" y2="484"/></g>
  <rect class="box violet" x="24" y="72" width="160" height="52" rx="8"/>
  <text class="name mid" x="104" y="94">Browser</text>
  <text class="note mid" x="104" y="112">the user signs in</text>
  <rect class="box teal" x="208" y="72" width="160" height="52" rx="8"/>
  <text class="name mid" x="288" y="94">Your app</text>
  <text class="note mid" x="288" y="112">makes a secret verifier</text>
  <rect class="box amber" x="392" y="72" width="160" height="52" rx="8"/>
  <text class="name mid" x="472" y="94">Auth server</text>
  <text class="note mid" x="472" y="112">issues codes and tokens</text>
  <rect class="box green" x="576" y="72" width="160" height="52" rx="8"/>
  <text class="name mid" x="656" y="94">API</text>
  <text class="note mid" x="656" y="112">checks the token</text>
  <g class="line"><path d="M288 172H470" marker-end="url(#pkce-arrow)"/></g>
  <text class="small mid" x="380" y="164">1 Sends a hash of the verifier</text>
  <g class="line"><path d="M104 220H470" marker-end="url(#pkce-arrow)"/></g>
  <text class="small" x="116" y="212">2 User signs in and approves</text>
  <g class="line"><path d="M472 268H290" marker-end="url(#pkce-arrow)"/></g>
  <text class="small mid" x="380" y="260">3 Authorization code</text>
  <g class="line"><path d="M288 316H470" marker-end="url(#pkce-arrow)"/></g>
  <text class="small mid" x="380" y="308">4 Code plus the verifier</text>
  <rect class="key" x="365" y="332" width="214" height="48" rx="8"/>
  <text class="small strong mid" x="472" y="352">5 Hashes the verifier</text>
  <text class="small mid" x="472" y="368">must match the hash from step 1</text>
  <g class="line"><path d="M472 412H290" marker-end="url(#pkce-arrow)"/></g>
  <text class="small mid" x="380" y="404">6 Access token</text>
  <g class="line"><path d="M288 460H654" marker-end="url(#pkce-arrow)"/></g>
  <text class="small" x="300" y="452">7 Calls the API with the token</text>
  <rect class="callout" x="24" y="504" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="526">Why it matters</text>
  <text class="small" x="40" y="546">An attacker who intercepts the code in step 3 can't redeem it: only your app knows the verifier</text>
</svg>
