<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296" role="img" aria-label="A retrieval assistant can cite sources because it answers only from what it retrieved">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="rag-pipeline-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A retrieval assistant can cite sources because it answers only from what it retrieved</text>
  <text class="note" x="24" y="54">The four steps behind a grounded answer</text>
  <rect class="box violet" x="24" y="76" width="160" height="108" rx="8"/>
  <rect class="badge violet" x="36" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 94) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name" x="36" y="140">Question</text>
  <text class="note" x="36" y="156">From a user in the app</text>
  <rect class="box teal" x="208" y="76" width="160" height="108" rx="8"/>
  <rect class="badge teal" x="220" y="88" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(226 94) scale(0.833333)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g>
  <text class="name" x="220" y="140">Retrieve</text>
  <text class="note" x="220" y="156">Top 8 passages from</text>
  <text class="note" x="220" y="172">the index</text>
  <g class="line"><path d="M184 130H208" marker-end="url(#rag-pipeline-b-arrow)"/></g>
  <rect class="key" x="392" y="76" width="160" height="108" rx="8"/>
  <g class="icon accent" transform="translate(410 94) scale(0.833333)"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/><path d="M19 15.5c.2 1.3.9 2 2.2 2.2-1.3.2-2 .9-2.2 2.2-.2-1.3-.9-2-2.2-2.2 1.3-.2 2-.9 2.2-2.2z"/></g>
  <text class="name" x="404" y="140">Answer</text>
  <text class="note" x="404" y="156">Written from those</text>
  <text class="note" x="404" y="172">passages only</text>
  <g class="line"><path d="M368 130H392" marker-end="url(#rag-pipeline-b-arrow)"/></g>
  <rect class="box green" x="576" y="76" width="160" height="108" rx="8"/>
  <rect class="badge green" x="588" y="88" width="32" height="32" rx="9"/><g class="icon green" transform="translate(594 94) scale(0.833333)"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g>
  <text class="name" x="588" y="140">Cite</text>
  <text class="note" x="588" y="156">Links each claim to</text>
  <text class="note" x="588" y="172">its passage</text>
  <g class="line"><path d="M552 130H576" marker-end="url(#rag-pipeline-b-arrow)"/></g>
  <rect class="callout" x="24" y="216" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="238">No source, no claim</text>
  <text class="small" x="40" y="258">If retrieval finds nothing relevant, the assistant says so instead of guessing</text>
</svg>
