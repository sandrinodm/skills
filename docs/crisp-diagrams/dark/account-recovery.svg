<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308" role="img" aria-label="Risky password resets need a second factor, not just an email link">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="account-recovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Risky password resets need a second factor, not just an email link</text>
  <text class="note" x="24" y="54">How account recovery adapts to the risk of each request</text>
  <rect class="box teal" x="24" y="76" width="160" height="72" rx="8"/>
  <text class="name" x="36" y="100">Reset requested</text>
  <text class="note" x="36" y="116">From the sign-in page</text>
  <rect class="box teal" x="208" y="76" width="160" height="72" rx="8"/>
  <text class="name" x="220" y="100">Risk check</text>
  <text class="note" x="220" y="116">Device, location and</text>
  <text class="note" x="220" y="132">account history</text>
  <g class="line"><path d="M184 112H208" marker-end="url(#account-recovery-arrow)"/></g>
  <rect class="box teal" x="392" y="76" width="160" height="72" rx="8"/>
  <text class="name" x="404" y="100">Email link</text>
  <text class="note" x="404" y="116">For familiar devices</text>
  <text class="note" x="404" y="132">and places</text>
  <g class="line"><path d="M368 112H392" marker-end="url(#account-recovery-arrow)"/></g>
  <rect class="box green" x="576" y="76" width="160" height="72" rx="8"/>
  <text class="name" x="588" y="100">New password</text>
  <text class="note" x="588" y="116">Old sessions are</text>
  <text class="note" x="588" y="132">signed out</text>
  <g class="line"><path d="M552 112H576" marker-end="url(#account-recovery-arrow)"/></g>
  <g class="line"><path d="M288 148V176H472V212" marker-end="url(#account-recovery-arrow)"/></g>
  <text class="note" x="296" y="168">high risk</text>
  <rect class="key" x="392" y="212" width="160" height="72" rx="8"/>
  <text class="name" x="404" y="236">Passkey or ID check</text>
  <text class="note" x="404" y="252">Before any link is</text>
  <text class="note" x="404" y="268">sent</text>
  <g class="line"><path d="M552 248H656V148" marker-end="url(#account-recovery-arrow)"/></g>
</svg>
