<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" role="img" aria-label="People like passkeys until they get a new phone">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="journey-passkey-setup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">People like passkeys until they get a new phone</text>
  <text class="note" x="24" y="54">A customer's journey with passkeys, from first prompt to recovery</text>
  <rect class="box teal" x="136" y="80" width="110.4" height="40" rx="8"/>
  <text class="name mid" x="191.2" y="105">Prompted</text>
  <rect class="box teal" x="258.4" y="80" width="110.4" height="40" rx="8"/>
  <text class="name mid" x="313.6" y="105">Creates</text>
  <rect class="box teal" x="380.8" y="80" width="110.4" height="40" rx="8"/>
  <text class="name mid" x="436" y="105">Signs in</text>
  <rect class="box teal" x="503.2" y="80" width="110.4" height="40" rx="8"/>
  <text class="name mid" x="558.4" y="105">New phone</text>
  <rect class="box teal" x="625.6" y="80" width="110.4" height="40" rx="8"/>
  <text class="name mid" x="680.8" y="105">Recovers</text>
  <text class="note" x="24" y="148">Doing</text>
  <text class="small" x="146" y="148">Sees an offer</text>
  <text class="small" x="146" y="164">to skip</text>
  <text class="small" x="146" y="180">passwords</text>
  <text class="small" x="268.4" y="148">Uses Face ID</text>
  <text class="small" x="268.4" y="164">once</text>
  <text class="small" x="390.8" y="148">Taps once, no</text>
  <text class="small" x="390.8" y="164">code</text>
  <text class="small" x="513.2" y="148">Passkey is</text>
  <text class="small" x="513.2" y="164">missing</text>
  <text class="small" x="635.6" y="148">Falls back to</text>
  <text class="small" x="635.6" y="164">email</text>
  <text class="note" x="24" y="224">Pleased</text>
  <text class="note" x="24" y="268">Feeling</text>
  <text class="note" x="24" y="312">Frustrated</text>
  <g class="life"><path d="M136 264H736"/></g>
  <g class="line"><path d="M191.2 264L313.6 224L436 224L558.4 304L680.8 284"/></g>
  <circle class="btn" cx="191.2" cy="264" r="5"/>
  <text class="note mid" x="191.2" y="252">Unsure</text>
  <circle class="btn" cx="313.6" cy="224" r="5"/>
  <text class="note mid" x="313.6" y="212">Impressed</text>
  <circle class="btn" cx="436" cy="224" r="5"/>
  <text class="note mid" x="436" y="212">Delighted</text>
  <circle class="btn" cx="558.4" cy="304" r="5"/>
  <text class="note mid" x="558.4" y="326">Locked out</text>
  <circle class="btn" cx="680.8" cy="284" r="5"/>
  <text class="note mid" x="680.8" y="306">Annoyed</text>
  <text class="note" x="24" y="356">Pain points</text>
  <rect class="key" x="503.2" y="336" width="110.4" height="56" rx="8"/>
  <text class="small" x="513.2" y="356">Didn't sync to</text>
  <text class="small" x="513.2" y="372">the new phone</text>
  <rect class="box rose" x="625.6" y="336" width="110.4" height="56" rx="8"/>
  <text class="small" x="635.6" y="356">Waits for a</text>
  <text class="small" x="635.6" y="372">code</text>
  <text class="note" x="24" y="428">Ideas</text>
  <rect class="box green" x="258.4" y="408" width="110.4" height="56" rx="8"/>
  <text class="small" x="268.4" y="428">Explain it in</text>
  <text class="small" x="268.4" y="444">one line</text>
  <rect class="box green" x="503.2" y="408" width="110.4" height="56" rx="8"/>
  <text class="small" x="513.2" y="428">Check sync at</text>
  <text class="small" x="513.2" y="444">setup</text>
</svg>
