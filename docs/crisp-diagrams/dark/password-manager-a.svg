<svg xmlns="http://www.w3.org/2000/svg" width="760" height="484" viewBox="0 0 760 484" role="img" aria-label="A password manager encrypts everything on your device before it syncs">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="password-manager-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A password manager encrypts everything on your device before it syncs</text>
  <text class="note" x="24" y="54">What runs inside an end-to-end encrypted password manager</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="258" y="100">You, on any device</text>
  <text class="note" x="258" y="116">Unlock with a master password or passkey</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#password-manager-a-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#password-manager-a-arrow)"/></g>
  <text class="note end" x="332" y="156">unlock</text>
  <text class="note" x="428" y="156">filled sign-ins</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="184" rx="8"/>
  <text class="name" x="40" y="196">Password manager app</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 223) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="82" y="236">Vault</text>
  <text class="note" x="82" y="252">Passwords, passkeys and</text>
  <text class="note" x="82" y="268">secure notes</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 223) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name" x="314" y="236">Autofill</text>
  <text class="note" x="314" y="252">Fills a sign-in form only</text>
  <text class="note" x="314" y="268">on the matching site</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 223) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="546" y="236">Generator</text>
  <text class="note" x="546" y="252">Creates a strong, unique</text>
  <text class="note" x="546" y="268">password per site</text>
  <rect class="key" x="40" y="300" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 310) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="82" y="324">Local encryption</text>
  <text x="207" y="324">the key never leaves your devices</text>
  <g class="line"><path d="M196 340V404" marker-end="url(#password-manager-a-arrow)"/></g>
  <rect class="box green" x="24" y="404" width="344" height="56" rx="8"/>
  <g class="icon green" transform="translate(36 415) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="66" y="428">Sync server</text>
  <text class="note" x="66" y="444">Stores only encrypted blobs it can't read</text>
  <g class="line"><path d="M564 340V404" marker-end="url(#password-manager-a-arrow)"/></g>
  <rect class="box green" x="392" y="404" width="344" height="56" rx="8"/>
  <g class="icon green" transform="translate(404 415) scale(0.833333)"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g>
  <text class="name" x="434" y="428">Your other devices</text>
  <text class="note" x="434" y="444">Download the blobs and decrypt them locally</text>
  <text class="note" x="204" y="384">encrypted vault only</text>
</svg>
