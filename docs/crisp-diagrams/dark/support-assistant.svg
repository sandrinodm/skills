<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-label="A support assistant answers from your help center, and hands off when it&#x27;s unsure">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="support-assistant-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A support assistant answers from your help center, and hands off when it's unsure</text>
  <text class="note" x="24" y="54">What sits inside an AI assistant for customer support</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <text class="name mid" x="380" y="100">Customers</text>
  <text class="note mid" x="380" y="116">Write in by chat or email</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#support-assistant-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#support-assistant-arrow)"/></g>
  <text class="note end" x="332" y="156">questions</text>
  <text class="note" x="428" y="156">answers</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="256" rx="8"/>
  <text class="name" x="40" y="196">Support assistant</text>
  <rect class="box teal" x="40" y="212" width="332" height="72" rx="8"/>
  <text class="name" x="52" y="236">Retriever</text>
  <text class="note" x="52" y="252">Finds the help-center articles that match the</text>
  <text class="note" x="52" y="268">question</text>
  <rect class="box teal" x="388" y="212" width="332" height="72" rx="8"/>
  <text class="name" x="400" y="236">Answer writer</text>
  <text class="note" x="400" y="252">Replies in your tone and cites the article it used</text>
  <rect class="box teal" x="40" y="300" width="332" height="56" rx="8"/>
  <text class="name" x="52" y="324">Policy rules</text>
  <text class="note" x="52" y="340">Refund limits, tone, and topics to avoid</text>
  <rect class="box teal" x="388" y="300" width="332" height="56" rx="8"/>
  <text class="name" x="400" y="324">Conversation memory</text>
  <text class="note" x="400" y="340">Remembers what the customer said earlier</text>
  <rect class="key" x="40" y="372" width="680" height="40" rx="8"/>
  <text class="name" x="56" y="396">Escalation check</text>
  <text x="181" y="396">unsure, or an upset customer? a person takes over</text>
  <g class="line"><path d="M132 412V476" marker-end="url(#support-assistant-arrow)"/></g>
  <rect class="box green" x="24" y="476" width="216" height="72" rx="8"/>
  <text class="name" x="36" y="500">Help center</text>
  <text class="note" x="36" y="516">The articles it answers from</text>
  <g class="line"><path d="M380 412V476" marker-end="url(#support-assistant-arrow)"/></g>
  <rect class="box green" x="272" y="476" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="500">Ticketing system</text>
  <text class="note" x="284" y="516">Gets a ticket for every handoff</text>
  <g class="line"><path d="M628 412V476" marker-end="url(#support-assistant-arrow)"/></g>
  <rect class="box green" x="520" y="476" width="216" height="72" rx="8"/>
  <text class="name" x="532" y="500">Support team</text>
  <text class="note" x="532" y="516">Picks up handoffs with the full</text>
  <text class="note" x="532" y="532">context</text>
  <text class="note" x="388" y="456">handoffs with context</text>
</svg>
