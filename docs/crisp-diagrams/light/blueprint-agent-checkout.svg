  <rect class="box amber" x="310" y="260" width="134" height="48" rx="8"/>
  <text class="small mid" x="377" y="288">Prices the cart</text>
  <rect class="box green" x="310" y="344" width="134" height="48" rx="8"/>
  <text class="small mid" x="377" y="372">Checkout API</text>
  <rect class="box violet" x="456" y="92" width="134" height="48" rx="8"/>
  <text class="small mid" x="523" y="120">Approves the cart</text>
  <rect class="box teal" x="456" y="176" width="134" height="48" rx="8"/>
  <text class="small mid" x="523" y="204">Signs the mandate</text>
  <rect class="key" x="456" y="260" width="134" height="48" rx="8"/>
  <text class="small mid" x="523" y="288">Checks the mandate</text>
  <rect class="box green" x="456" y="344" width="134" height="48" rx="8"/>
  <text class="small mid" x="523" y="372">Payment network</text>
  <rect class="box violet" x="602" y="92" width="134" height="48" rx="8"/>
  <text class="small mid" x="669" y="120">Gets a receipt</text>
  <rect class="box amber" x="602" y="260" width="134" height="48" rx="8"/>
  <text class="small mid" x="669" y="288">Ships the order</text>
  <rect class="box green" x="602" y="344" width="134" height="48" rx="8"/>
  <text class="small mid" x="669" y="372">Warehouse</text>
  <g class="line"><path d="M231 140V176" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M231 224V344" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M377 224V260" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M377 308V344" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M523 140V176" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M523 224V260" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M523 308V344" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M669 140V260" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M669 308V344" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M298 116H456" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
  <g class="line"><path d="M590 116H602" marker-end="url(#blueprint-agent-checkout-arrow)"/></g>
</svg>
