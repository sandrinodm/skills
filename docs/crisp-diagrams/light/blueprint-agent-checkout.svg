  <text class="name" x="24" y="204">Agent</text>
  <g class="line"><path d="M24 164H736"/></g>
  <text class="note" x="24" y="157">line of interaction</text>
  <text class="name" x="24" y="288">Merchant</text>
  <g class="life"><path d="M24 248H736"/></g>
  <text class="note" x="24" y="241">line of visibility</text>
  <text class="name" x="24" y="372">Systems</text>
  <g class="line"><path d="M24 332H736"/></g>
  <text class="note" x="24" y="325">internal line</text>
  <rect class="box violet" x="164" y="92" width="134" height="48" rx="8"/>
  <text class="small mid" x="231" y="120">Asks for shoes</text>
  <rect class="box teal" x="164" y="176" width="134" height="48" rx="8"/>
