<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-label="A telemetry pipeline samples before it stores, so costs stay flat as traffic grows">
  <style>
/* crisp-diagrams theme: pastel: flat soft fills per group. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:none}
.box.blue,.chip.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.green,.chip.green{fill:var(--green);stroke:var(--green-line)}
.box.violet,.chip.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.amber,.chip.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.rose,.chip.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.teal,.chip.teal{fill:var(--teal);stroke:var(--teal-line)}
.box.zone.blue{fill:none;stroke:var(--blue-line)}
.box.zone.green{fill:none;stroke:var(--green-line)}
.box.zone.violet{fill:none;stroke:var(--violet-line)}
.box.zone.amber{fill:none;stroke:var(--amber-line)}
.box.zone.rose{fill:none;stroke:var(--rose-line)}
.box.zone.teal{fill:none;stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{fill:var(--blue);stroke:var(--blue-line)}
.device.green{fill:var(--green);stroke:var(--green-line)}
.device.violet{fill:var(--violet);stroke:var(--violet-line)}
.device.amber{fill:var(--amber);stroke:var(--amber-line)}
.device.rose{fill:var(--rose);stroke:var(--rose-line)}
.device.teal{fill:var(--teal);stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--paper);stroke:var(--blue-line);stroke-width:1}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--paper);stroke:var(--green-line);stroke-width:1}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--paper);stroke:var(--violet-line);stroke-width:1}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--paper);stroke:var(--amber-line);stroke-width:1}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--paper);stroke:var(--rose-line);stroke-width:1}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--paper);stroke:var(--teal-line);stroke-width:1}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="telemetry-pipeline-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A telemetry pipeline samples before it stores, so costs stay flat as traffic grows</text>
  <text class="note" x="24" y="54">The stages between your services and your observability tools</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="258" y="100">Your services</text>
  <text class="note" x="258" y="116">Send logs, metrics and traces</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <text class="note end" x="332" y="156">telemetry</text>
  <text class="note" x="428" y="156">acknowledgements</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="272" rx="8"/>
  <text class="name" x="40" y="196">Telemetry pipeline</text>
  <rect class="key" x="40" y="212" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 222) scale(0.833333)"><path d="M3.5 5h17l-6.5 7.5V19l-4 2v-8.5z"/></g>
  <text class="name" x="82" y="236">Sampler</text>
  <text x="146" y="236">keeps every error and 10% of the rest</text>
  <rect class="box teal" x="40" y="268" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 279) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="82" y="292">Collector</text>
  <text class="note" x="82" y="308">Receives OpenTelemetry data</text>
  <rect class="box teal" x="272" y="268" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 279) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="314" y="292">Parser</text>
  <text class="note" x="314" y="308">Turns raw log lines into</text>
  <text class="note" x="314" y="324">fields</text>
  <rect class="box teal" x="504" y="268" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 279) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="546" y="292">Enricher</text>
  <text class="note" x="546" y="308">Adds team, version and</text>
  <text class="note" x="546" y="324">region</text>
  <rect class="box teal" x="40" y="356" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 367) scale(0.833333)"><path d="M3.5 5h17l-6.5 7.5V19l-4 2v-8.5z"/></g>
  <text class="name" x="82" y="380">Redactor</text>
  <text class="note" x="82" y="396">Removes emails, tokens and</text>
  <text class="note" x="82" y="412">card numbers</text>
  <rect class="box teal" x="272" y="356" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 367) scale(0.833333)"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/></g>
  <text class="name" x="314" y="380">Router</text>
  <text class="note" x="314" y="396">Sends each signal to the</text>
  <text class="note" x="314" y="412">right store</text>
  <rect class="box teal" x="504" y="356" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 367) scale(0.833333)"><path d="M5.5 5h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g>
  <text class="name" x="546" y="380">Buffer</text>
  <text class="note" x="546" y="396">Holds data while a store is</text>
  <text class="note" x="546" y="412">down</text>
  <g class="line"><path d="M107 444V492" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <rect class="box green" x="24" y="492" width="166" height="72" rx="8"/>
  <g class="icon green" transform="translate(36 503) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="66" y="516">Log store</text>
  <text class="note" x="66" y="532">Search and</text>
  <text class="note" x="66" y="548">retention</text>
  <g class="line"><path d="M289 444V492" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <rect class="box green" x="206" y="492" width="166" height="72" rx="8"/>
  <g class="icon green" transform="translate(218 503) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="248" y="516">Metrics</text>
  <text class="note" x="248" y="532">Dashboards and</text>
  <text class="note" x="248" y="548">SLOs</text>
  <g class="line"><path d="M471 444V492" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <rect class="box green" x="388" y="492" width="166" height="72" rx="8"/>
  <g class="icon green" transform="translate(400 503) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name" x="430" y="516">Traces</text>
  <text class="note" x="430" y="532">Request timelines</text>
  <g class="line"><path d="M653 444V492" marker-end="url(#telemetry-pipeline-b-arrow)"/></g>
  <rect class="box green" x="570" y="492" width="166" height="72" rx="8"/>
  <g class="icon green" transform="translate(582 503) scale(0.833333)"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.3v.2"/></g>
  <text class="name" x="612" y="516">Alerting</text>
  <text class="note" x="612" y="532">Pages the on-call</text>
  <text class="note" x="297" y="472">routed signals</text>
</svg>
