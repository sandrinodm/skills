<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408" role="img" aria-label="MCP builds on JSON-RPC, and adds OAuth only for remote servers">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="mcp-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">MCP builds on JSON-RPC, and adds OAuth only for remote servers</text>
  <text class="note" x="24" y="54">The layers of the Model Context Protocol, from what servers offer down to the wire</text>
  <rect class="box teal" x="24" y="72" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="94">Primitives</text>
  <text class="small" x="40" y="114">Tools, resources and prompts</text>
  <rect class="chip amber" x="510" y="87" width="88" height="26" rx="13"/>
  <text class="small mid" x="554" y="104">tools/call</text>
  <rect class="chip amber" x="606" y="87" width="114" height="26" rx="13"/>
  <text class="small mid" x="663" y="104">resources/read</text>
  <rect class="box teal" x="24" y="136" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="158">Lifecycle</text>
  <text class="small" x="40" y="178">Connect, agree on capabilities, close</text>
  <rect class="chip amber" x="632" y="151" width="88" height="26" rx="13"/>
  <text class="small mid" x="676" y="168">initialize</text>
  <rect class="box teal" x="24" y="200" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="222">Messages</text>
  <text class="small" x="40" y="242">JSON-RPC 2.0 requests and notifications</text>
  <rect class="chip amber" x="645" y="215" width="75" height="26" rx="13"/>
  <text class="small mid" x="682.5" y="232">JSON-RPC</text>
  <rect class="box teal" x="24" y="264" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="286">Transport</text>
  <text class="small" x="40" y="306">How the bytes move</text>
  <rect class="chip amber" x="536" y="279" width="56" height="26" rx="13"/>
  <text class="small mid" x="564" y="296">stdio</text>
  <rect class="chip amber" x="600" y="279" width="120" height="26" rx="13"/>
  <text class="small mid" x="660" y="296">Streamable HTTP</text>
  <rect class="key" x="24" y="328" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="350">Authorization</text>
  <text class="small" x="40" y="370">OAuth 2.1, for servers reached over HTTP</text>
  <rect class="chip amber" x="516" y="343" width="50" height="26" rx="13"/>
  <text class="small mid" x="541" y="360">PKCE</text>
  <rect class="chip amber" x="574" y="343" width="146" height="26" rx="13"/>
  <text class="small mid" x="647" y="360">Resource indicators</text>
</svg>
