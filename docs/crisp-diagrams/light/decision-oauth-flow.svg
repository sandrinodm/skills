<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Most apps should use the authorization code flow with PKCE">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="decision-oauth-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Most apps should use the authorization code flow with PKCE</text>
  <text class="note" x="24" y="54">Which OAuth flow to use</text>
  <rect class="box" x="229.867" y="80" width="181.6" height="44" rx="8"/>
  <text class="name mid" x="320.667" y="105">Does a person sign in?</text>
  <g class="line"><path d="M320.667 124V146H142.667V192" marker-end="url(#decision-oauth-flow-arrow)"/></g>
  <text class="note" x="150.667" y="173">no</text>
  <rect class="box amber" x="54.6667" y="192" width="176" height="72" rx="8"/>
  <text class="name mid" x="142.667" y="216">Client credentials</text>
  <text class="note mid" x="142.667" y="232">Machine to machine, no</text>
  <text class="note mid" x="142.667" y="248">user</text>
  <g class="line"><path d="M320.667 124V146H498.667V192" marker-end="url(#decision-oauth-flow-arrow)"/></g>
  <text class="note" x="506.667" y="173">yes</text>
  <rect class="box" x="382.667" y="192" width="232" height="62" rx="8"/>
  <text class="name mid" x="498.667" y="217">Does the device have a</text>
  <text class="name mid" x="498.667" y="235">browser?</text>
  <g class="line"><path d="M498.667 254V276H380V304" marker-end="url(#decision-oauth-flow-arrow)"/></g>
  <text class="note" x="388" y="294">no</text>
  <rect class="box violet" x="292" y="304" width="176" height="56" rx="8"/>
  <text class="name mid" x="380" y="328">Device flow</text>
  <text class="note mid" x="380" y="344">Sign in on another device</text>
  <g class="line"><path d="M498.667 254V276H617.333V304" marker-end="url(#decision-oauth-flow-arrow)"/></g>
  <text class="note" x="625.333" y="294">yes</text>
  <rect class="key" x="529.333" y="304" width="176" height="72" rx="8"/>
  <text class="name mid" x="617.333" y="328">Code flow + PKCE</text>
  <text class="small mid" x="617.333" y="344">Web, mobile and desktop</text>
  <text class="small mid" x="617.333" y="360">apps</text>
</svg>
