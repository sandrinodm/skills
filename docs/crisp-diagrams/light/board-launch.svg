  <g class="icon violet" transform="translate(36 84) scale(0.75)"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
  <text class="name" x="60" y="98">To do</text>
