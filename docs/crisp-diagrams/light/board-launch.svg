  <text class="small mid" x="165" y="98">2</text>
  <rect class="box violet" x="32" y="116" width="150" height="56" rx="8"/>
  <text class="small strong" x="44" y="139">Press release</text>
  <text class="note" x="44" y="156">Marketing</text>
