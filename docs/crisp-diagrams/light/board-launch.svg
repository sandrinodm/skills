  <text class="small strong" x="226" y="139">Docs and guides</text>
  <text class="note" x="226" y="156">Developer relations</text>
  <rect class="box teal" x="214" y="180" width="150" height="56" rx="8"/>
  <text class="small strong" x="226" y="203">Pricing page</text>
  <text class="note" x="226" y="220">Web team</text>
  <rect class="box zone rose" x="388" y="72" width="166" height="176" rx="8"/>
  <g class="icon rose" transform="translate(400 84) scale(0.75)"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.3v.2"/></g>
