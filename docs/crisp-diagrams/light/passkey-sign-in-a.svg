<svg xmlns="http://www.w3.org/2000/svg" width="760" height="656" viewBox="0 0 760 656" role="img" aria-label="A passkey sign-in proves you hold the key without the key ever leaving your device">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="passkey-sign-in-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A passkey sign-in proves you hold the key without the key ever leaving your device</text>
  <text class="note" x="24" y="54">What happens between you, your device, the browser and the website</text>
  <g class="life"><line x1="104" x2="104" y1="148" y2="556"/></g>
  <g class="life"><line x1="288" x2="288" y1="148" y2="556"/></g>
  <g class="life"><line x1="472" x2="472" y1="148" y2="556"/></g>
  <g class="life"><line x1="656" x2="656" y1="148" y2="556"/></g>
  <rect class="box violet" x="24" y="72" width="160" height="76" rx="8"/>
  <g class="icon violet" transform="translate(94 82) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name mid" x="104" y="118">You</text>
  <text class="note mid" x="104" y="136">face or fingerprint</text>
  <rect class="box teal" x="208" y="72" width="160" height="76" rx="8"/>
  <g class="icon teal" transform="translate(278 82) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name mid" x="288" y="118">Authenticator</text>
  <text class="note mid" x="288" y="136">phone or laptop</text>
  <rect class="box amber" x="392" y="72" width="160" height="76" rx="8"/>
  <g class="icon amber" transform="translate(462 82) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name mid" x="472" y="118">Browser</text>
  <text class="note mid" x="472" y="136">WebAuthn</text>
  <rect class="box green" x="576" y="72" width="160" height="76" rx="8"/>
  <g class="icon green" transform="translate(646 82) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name mid" x="656" y="118">Website</text>
  <text class="note mid" x="656" y="136">example.com</text>
  <g class="line"><path d="M472 196H654" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="564" y="188">1 Wants to sign in</text>
  <g class="line"><path d="M656 244H474" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="564" y="236">2 Challenge for example.com</text>
  <g class="line"><path d="M472 292H290" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="380" y="284">3 Sign this challenge</text>
  <g class="line"><path d="M104 340H286" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="196" y="332">4 Face or fingerprint</text>
  <rect class="key" x="181" y="356" width="214" height="48" rx="8"/>
  <text class="small strong mid" x="288" y="376">5 Signs with the private key</text>
  <text class="small mid" x="288" y="392">the key never leaves the device</text>
  <g class="line"><path d="M288 436H470" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="380" y="428">6 Signed assertion</text>
  <g class="line"><path d="M472 484H654" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="564" y="476">7 Assertion to verify</text>
  <g class="line"><path d="M656 532H474" marker-end="url(#passkey-sign-in-a-arrow)"/></g>
  <text class="small mid" x="564" y="524">8 Signed in</text>
  <rect class="callout" x="24" y="576" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="598">Phishing-resistant by design</text>
  <text class="small" x="40" y="618">The browser only uses a passkey on the domain it was made for, so a fake site gets nothing</text>
</svg>
