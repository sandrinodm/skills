<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296" role="img" aria-label="A deletion request reaches every system within 30 days, backups included">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="data-deletion-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A deletion request reaches every system within 30 days, backups included</text>
  <text class="note" x="24" y="54">How a privacy request to delete personal data is carried out</text>
  <rect class="box violet" x="24" y="76" width="216" height="108" rx="8"/>
  <rect class="badge violet" x="36" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 94) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name" x="36" y="140">Request received</text>
  <text class="note" x="36" y="156">From the privacy page, identity</text>
  <text class="note" x="36" y="172">confirmed</text>
  <rect class="key" x="272" y="76" width="216" height="108" rx="8"/>
  <g class="icon accent" transform="translate(290 94) scale(0.833333)"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.5"/></g>
  <text class="name" x="284" y="140">Delete everywhere</text>
  <text class="note" x="284" y="156">Databases, search index,</text>
  <text class="note" x="284" y="172">analytics and support tools</text>
  <g class="line"><path d="M240 130H272" marker-end="url(#data-deletion-a-arrow)"/></g>
  <rect class="box green" x="520" y="76" width="216" height="108" rx="8"/>
  <rect class="badge green" x="532" y="88" width="32" height="32" rx="9"/><g class="icon green" transform="translate(538 94) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="532" y="140">Confirmation</text>
  <text class="note" x="532" y="156">Sent to the person with a</text>
  <text class="note" x="532" y="172">deletion receipt</text>
  <g class="line"><path d="M488 130H520" marker-end="url(#data-deletion-a-arrow)"/></g>
  <rect class="callout" x="24" y="216" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="238">Backups age out instead of being edited</text>
  <text class="small" x="40" y="258">Backups expire after 30 days, so deleted data disappears from them on schedule</text>
</svg>
