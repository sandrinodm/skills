  <rect class="badge teal" x="52" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 230) scale(0.833333)"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/><path d="M19 15.5c.2 1.3.9 2 2.2 2.2-1.3.2-2 .9-2.2 2.2-.2-1.3-.9-2-2.2-2.2 1.3-.2 2-.9 2.2-2.2z"/></g>
  <text class="name" x="52" y="276">Model</text>
  <text class="note" x="52" y="292">Plans the task and writes the</text>
  <text class="note" x="52" y="308">result</text>
  <rect class="box teal" x="272" y="212" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="284" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(290 230) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
  <text class="name" x="284" y="276">Company memory</text>
  <text class="note" x="284" y="292">Docs and decisions it's allowed</text>
  <text class="note" x="284" y="308">to use</text>
  <rect class="box teal" x="504" y="212" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="516" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(522 230) scale(0.833333)"><path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/></g>
  <text class="name" x="516" y="276">Connectors</text>
