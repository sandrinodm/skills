  <rect class="box teal" x="40" y="336" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="52" y="348" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 354) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="52" y="400">Approvals</text>
  <text class="note" x="52" y="416">Asks a person before risky steps</text>
  <rect class="box teal" x="388" y="336" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="400" y="348" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(406 354) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
