<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-label="Prompts pass a redaction gate before they leave the company">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="ai-gateway-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Prompts pass a redaction gate before they leave the company</text>
  <text class="note" x="24" y="54">How a company routes employees' AI requests through its own gateway</text>
  <rect class="box violet" x="232" y="76" width="488" height="56" rx="8"/>
  <rect class="badge violet" x="246" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(252 94) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="290" y="100">Employees</text>
  <text class="note" x="290" y="116">Use AI tools for everyday work</text>
  <rect class="box zone violet" x="24" y="180" width="712" height="160" rx="8"/>
  <text class="name" x="40" y="220">Company devices</text>
  <text class="note" x="40" y="240">Where prompts are written</text>
  <text class="note" x="40" y="256">Full customer data here</text>
  <rect class="box violet" x="232" y="196" width="488" height="40" rx="8"/>
  <g class="icon violet" transform="translate(246 206) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name" x="274" y="220">AI apps</text>
  <text x="351" y="220">chat, coding and search tools</text>
  <rect class="box violet" x="232" y="268" width="232" height="56" rx="8"/>
  <g class="icon violet" transform="translate(244 279) scale(0.833333)"><path d="M4 5.5h16v10H10l-4 3.5v-3.5H4z"/></g>
  <text class="name" x="274" y="292">Chat app</text>
  <text class="note" x="274" y="308">General questions</text>
  <rect class="box violet" x="488" y="268" width="232" height="56" rx="8"/>
  <g class="icon violet" transform="translate(500 279) scale(0.833333)"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M3 12.5v3M21 12.5v3M9.5 13v1M14.5 13v1"/><circle cx="12" cy="3.5" r="1"/></g>
  <text class="name" x="530" y="292">Code assistant</text>
  <text class="note" x="530" y="308">Suggestions in the editor</text>
  <g class="line"><path d="M348 236V268" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M604 236V268" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M476 132V196" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <text class="note" x="488" y="160">prompts</text>
  <rect class="box zone teal" x="24" y="388" width="712" height="160" rx="8"/>
  <text class="name" x="40" y="428">AI gateway</text>
  <text class="note" x="40" y="448">Run by IT</text>
  <text class="note" x="40" y="464">Logs every request</text>
  <rect class="key" x="232" y="404" width="488" height="40" rx="8"/>
  <g class="icon accent" transform="translate(246 414) scale(0.833333)"><path d="M3.5 5h17l-6.5 7.5V19l-4 2v-8.5z"/></g>
  <text class="name" x="274" y="428">Redaction</text>
  <text x="351" y="428">strips customer names, emails and keys</text>
  <rect class="box teal" x="232" y="476" width="232" height="56" rx="8"/>
  <g class="icon teal" transform="translate(244 487) scale(0.833333)"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/></g>
  <text class="name" x="274" y="500">Router</text>
  <text class="note" x="274" y="516">Picks the model for each task</text>
  <rect class="box teal" x="488" y="476" width="232" height="56" rx="8"/>
  <g class="icon teal" transform="translate(500 487) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="530" y="500">Audit log</text>
  <text class="note" x="530" y="516">Who sent what, and when</text>
  <g class="line"><path d="M348 444V476" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M464 504H488" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M348 324V404" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <text class="note" x="360" y="368">raw prompts</text>
  <rect class="box zone green" x="24" y="596" width="712" height="160" rx="8"/>
  <text class="name" x="40" y="636">Model providers</text>
  <text class="note" x="40" y="656">Outside the company</text>
  <text class="note" x="40" y="672">See only redacted text</text>
  <rect class="box green" x="232" y="612" width="488" height="40" rx="8"/>
  <g class="icon green" transform="translate(246 622) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="274" y="636">Contracts</text>
  <text x="351" y="636">no training on your data</text>
  <rect class="box green" x="232" y="684" width="232" height="56" rx="8"/>
  <g class="icon green" transform="translate(244 695) scale(0.833333)"><path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></g>
  <text class="name" x="274" y="708">Provider A</text>
  <text class="note" x="274" y="724">General-purpose model</text>
  <rect class="box green" x="488" y="684" width="232" height="56" rx="8"/>
  <g class="icon green" transform="translate(500 695) scale(0.833333)"><path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></g>
  <text class="name" x="530" y="708">Provider B</text>
  <text class="note" x="530" y="724">Code model</text>
  <g class="line"><path d="M348 652V684" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M604 652V684" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <g class="line"><path d="M348 532V612" marker-end="url(#ai-gateway-b-arrow)"/></g>
  <text class="note" x="360" y="576">redacted prompts</text>
</svg>
