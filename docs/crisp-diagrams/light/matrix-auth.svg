<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-label="Passkeys are the only sign-in method that is both phishing-resistant and effortless">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="matrix-auth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Passkeys are the only sign-in method that is both phishing-resistant and effortless</text>
  <text class="note" x="24" y="54">Sign-in methods compared</text>
  <rect class="box" x="24" y="72" width="712" height="240" rx="8"/>
  <rect class="key" x="621" y="76" width="111" height="232" rx="8"/>
  <text class="note" x="40" y="106">What you get</text>
  <text class="name mid" x="319.5" y="99">Password</text>
  <text class="note mid" x="319.5" y="115">Something you know</text>
  <text class="name mid" x="438.5" y="99">SMS code</text>
  <text class="note mid" x="438.5" y="115">Texted to you</text>
  <text class="name mid" x="557.5" y="99">App code</text>
  <text class="note mid" x="557.5" y="115">Authenticator app</text>
  <text class="name mid" x="676.5" y="99">Passkey</text>
  <text class="note mid" x="676.5" y="115">On your device</text>
  <g class="line"><path d="M24 132H736"/></g>
  <text class="small" x="40" y="155">Resists phishing</text>
  <text class="note mid" x="319.5" y="155">—</text>
  <text class="note mid" x="438.5" y="155">—</text>
  <text class="note mid" x="557.5" y="155">—</text>
  <g class="icon green" transform="translate(667.5 141) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <g class="life"><line x1="36" x2="724" y1="168" y2="168"/></g>
  <text class="small" x="40" y="191">Nothing to type</text>
  <text class="note mid" x="319.5" y="191">—</text>
  <text class="note mid" x="438.5" y="191">—</text>
  <text class="note mid" x="557.5" y="191">—</text>
  <g class="icon green" transform="translate(667.5 177) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <g class="life"><line x1="36" x2="724" y1="204" y2="204"/></g>
  <text class="small" x="40" y="227">Works without signal</text>
  <g class="icon green" transform="translate(310.5 213) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <text class="note mid" x="438.5" y="227">—</text>
  <g class="icon green" transform="translate(548.5 213) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <g class="icon green" transform="translate(667.5 213) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <g class="life"><line x1="36" x2="724" y1="240" y2="240"/></g>
  <text class="small" x="40" y="263">Nothing secret on the server</text>
  <text class="note mid" x="319.5" y="263">—</text>
  <g class="icon green" transform="translate(429.5 249) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <text class="note mid" x="557.5" y="263">—</text>
  <g class="icon green" transform="translate(667.5 249) scale(0.75)"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
  <g class="life"><line x1="36" x2="724" y1="276" y2="276"/></g>
  <text class="small" x="40" y="299">Setup time</text>
  <text class="small mid" x="319.5" y="299">none</text>
  <text class="small mid" x="438.5" y="299">a minute</text>
  <text class="small mid" x="557.5" y="299">two minutes</text>
  <text class="small mid" x="676.5" y="299">seconds</text>
</svg>
