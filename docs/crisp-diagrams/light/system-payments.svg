<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-label="The payments platform sits between shoppers, merchants and the card networks">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="system-payments-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">The payments platform sits between shoppers, merchants and the card networks</text>
  <text class="note" x="24" y="54">System context: who and what the payments platform talks to</text>
  <rect class="box violet" x="24" y="80" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 91) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="66" y="104">Shoppers</text>
  <text class="note" x="66" y="120">Pay on the web or in</text>
  <text class="note" x="66" y="136">an app</text>
  <rect class="box violet" x="24" y="176" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 187) scale(0.833333)"><path d="M4 9.5V20h16V9.5M3 9.5l2-5.5h14l2 5.5zM9.5 20v-5h5v5"/></g>
  <text class="name" x="66" y="200">Merchants</text>
  <text class="note" x="66" y="216">Run their store</text>
  <rect class="box violet" x="24" y="272" width="176" height="72" rx="8"/>
  <g class="icon violet" transform="translate(36 283) scale(0.833333)"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5.5A1.5 1.5 0 0 1 4 17.5zM20 14h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5zM17 19c0 1.5-2 2.5-5 2.5"/></g>
  <text class="name" x="66" y="296">Support agents</text>
  <text class="note" x="66" y="312">Look up payments</text>
  <rect class="box green" x="560" y="80" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 91) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name" x="602" y="104">Card networks</text>
  <text class="note" x="602" y="120">Visa, Mastercard</text>
  <rect class="box green" x="560" y="176" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 187) scale(0.833333)"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15M10.5 21v-3h3v3"/></g>
  <text class="name" x="602" y="200">Banks</text>
  <text class="note" x="602" y="216">Receive payouts</text>
  <rect class="box green" x="560" y="272" width="176" height="72" rx="8"/>
  <g class="icon green" transform="translate(572 283) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="602" y="296">Fraud service</text>
  <text class="note" x="602" y="312">Scores each payment</text>
  <rect class="key" x="296" y="80" width="168" height="264" rx="8"/>
  <g class="icon accent" transform="translate(370 163) scale(1.16667)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name mid" x="380" y="209">Payments platform</text>
  <text class="small mid" x="380" y="225">Takes payments, pays</text>
  <text class="small mid" x="380" y="241">merchants, keeps the</text>
  <text class="small mid" x="380" y="257">ledger</text>
  <rect class="box teal" x="280" y="400" width="200" height="56" rx="8"/>
  <g class="icon teal" transform="translate(292 411) scale(0.833333)"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text class="name" x="322" y="424">Ledger</text>
  <text class="note" x="322" y="440">Every money movement</text>
  <g class="line"><path d="M200 116H296" marker-end="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="248" y="108">pays</text>
  <g class="line"><path d="M200 212H296" marker-end="url(#system-payments-arrow)" marker-start="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="248" y="204">manages</text>
  <g class="line"><path d="M200 308H296" marker-end="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="248" y="300">looks up</text>
  <g class="line"><path d="M464 116H560" marker-end="url(#system-payments-arrow)" marker-start="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="512" y="108">authorizes</text>
  <g class="line"><path d="M464 212H560" marker-end="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="512" y="204">pays out</text>
  <g class="line"><path d="M464 308H560" marker-end="url(#system-payments-arrow)" marker-start="url(#system-payments-arrow)"/></g>
  <text class="note mid" x="512" y="300">scores</text>
  <g class="line"><path d="M380 344V400" marker-end="url(#system-payments-arrow)"/></g>
  <text class="note" x="388" y="376">writes</text>
</svg>
