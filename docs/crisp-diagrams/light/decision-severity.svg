<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="An incident is SEV 1 only when customers are affected and can&#x27;t work around it">
  <style>
/* crisp-diagrams theme: pastel: flat soft fills per group. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:none}
.box.blue,.chip.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.green,.chip.green{fill:var(--green);stroke:var(--green-line)}
.box.violet,.chip.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.amber,.chip.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.rose,.chip.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.teal,.chip.teal{fill:var(--teal);stroke:var(--teal-line)}
.box.zone.blue{fill:none;stroke:var(--blue-line)}
.box.zone.green{fill:none;stroke:var(--green-line)}
.box.zone.violet{fill:none;stroke:var(--violet-line)}
.box.zone.amber{fill:none;stroke:var(--amber-line)}
.box.zone.rose{fill:none;stroke:var(--rose-line)}
.box.zone.teal{fill:none;stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{fill:var(--blue);stroke:var(--blue-line)}
.device.green{fill:var(--green);stroke:var(--green-line)}
.device.violet{fill:var(--violet);stroke:var(--violet-line)}
.device.amber{fill:var(--amber);stroke:var(--amber-line)}
.device.rose{fill:var(--rose);stroke:var(--rose-line)}
.device.teal{fill:var(--teal);stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--paper);stroke:var(--blue-line);stroke-width:1}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--paper);stroke:var(--green-line);stroke-width:1}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--paper);stroke:var(--violet-line);stroke-width:1}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--paper);stroke:var(--amber-line);stroke-width:1}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--paper);stroke:var(--rose-line);stroke-width:1}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--paper);stroke:var(--teal-line);stroke-width:1}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="decision-severity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">An incident is SEV 1 only when customers are affected and can't work around it</text>
  <text class="note" x="24" y="54">Picking the severity of an incident</text>
  <rect class="box" x="285.8" y="80" width="188.4" height="44" rx="8"/>
  <text class="name mid" x="380" y="105">Are customers affected?</text>
  <g class="line"><path d="M380 124V146H202V192" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="210" y="173">no</text>
  <rect class="box" x="131.6" y="192" width="140.8" height="44" rx="8"/>
  <text class="name mid" x="202" y="217">Is data at risk?</text>
  <g class="line"><path d="M202 236V258H113V304" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="121" y="285">yes</text>
  <rect class="box amber" x="32" y="304" width="162" height="56" rx="8"/>
  <text class="name mid" x="113" y="328">SEV 2</text>
  <text class="note mid" x="113" y="344">Page security now</text>
  <g class="line"><path d="M202 236V258H291V304" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="299" y="285">no</text>
  <rect class="box green" x="210" y="304" width="162" height="56" rx="8"/>
  <text class="name mid" x="291" y="328">SEV 4</text>
  <text class="note mid" x="291" y="344">Fix this week</text>
  <g class="line"><path d="M380 124V146H558V192" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="566" y="173">yes</text>
  <rect class="box" x="467.2" y="192" width="181.6" height="44" rx="8"/>
  <text class="name mid" x="558" y="217">Is there a workaround?</text>
  <g class="line"><path d="M558 236V258H469V304" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="477" y="285">yes</text>
  <rect class="box teal" x="388" y="304" width="162" height="56" rx="8"/>
  <text class="name mid" x="469" y="328">SEV 3</text>
  <text class="note mid" x="469" y="344">Fix today</text>
  <g class="line"><path d="M558 236V258H647V304" marker-end="url(#decision-severity-arrow)"/></g>
  <text class="note" x="655" y="285">no</text>
  <rect class="key" x="566" y="304" width="162" height="72" rx="8"/>
  <text class="name mid" x="647" y="328">SEV 1</text>
  <text class="small mid" x="647" y="344">Page everyone, update</text>
  <text class="small mid" x="647" y="360">status</text>
</svg>
