<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-label="An agent wallet spends only inside the limits you set">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="agent-wallet-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">An agent wallet spends only inside the limits you set</text>
  <text class="note" x="24" y="54">What sits inside a wallet built for AI agents, and what it pays</text>
  <rect class="box violet" x="66" y="76" width="280" height="56" rx="8"/>
  <rect class="badge violet" x="80" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(86 94) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="124" y="100">You, the owner</text>
  <text class="note" x="124" y="116">Fund the wallet and set its rules</text>
  <rect class="box violet" x="414" y="76" width="280" height="56" rx="8"/>
  <rect class="badge violet" x="428" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(434 94) scale(0.833333)"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M3 12.5v3M21 12.5v3M9.5 13v1M14.5 13v1"/><circle cx="12" cy="3.5" r="1"/></g>
  <text class="name" x="472" y="100">Your agent</text>
  <text class="note" x="472" y="116">Asks the wallet to pay for things</text>
  <g class="line"><path d="M206 132V172" marker-end="url(#agent-wallet-a-arrow)"/></g>
  <text class="note" x="214" y="156">rules and funds</text>
  <g class="line"><path d="M554 132V172" marker-end="url(#agent-wallet-a-arrow)"/></g>
  <text class="note" x="562" y="156">payment requests</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="256" rx="8"/>
  <text class="name" x="40" y="196">Agent wallet</text>
  <rect class="box teal" x="40" y="212" width="332" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 223) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="82" y="236">Keys</text>
  <text class="note" x="82" y="252">Held in secure hardware, never shown to the</text>
  <text class="note" x="82" y="268">agent</text>
  <rect class="box teal" x="388" y="212" width="332" height="72" rx="8"/>
  <g class="icon teal" transform="translate(400 223) scale(0.833333)"><path d="M4 7.5V18a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-1.5zM4 7.5A2 2 0 0 1 6 5.5h11V9"/><circle cx="16.5" cy="14.5" r="1.2"/></g>
  <text class="name" x="430" y="236">Balance</text>
  <text class="note" x="430" y="252">Stablecoins or a linked card</text>
  <rect class="box teal" x="40" y="300" width="332" height="56" rx="8"/>
  <g class="icon teal" transform="translate(52 311) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="82" y="324">Receipts</text>
  <text class="note" x="82" y="340">Every payment, with what it bought</text>
  <rect class="box teal" x="388" y="300" width="332" height="56" rx="8"/>
  <g class="icon teal" transform="translate(400 311) scale(0.833333)"><path d="M4 7.5V18a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-1.5zM4 7.5A2 2 0 0 1 6 5.5h11V9"/><circle cx="16.5" cy="14.5" r="1.2"/></g>
  <text class="name" x="430" y="324">Recovery</text>
  <text class="note" x="430" y="340">Lets you freeze or move the funds at any time</text>
  <rect class="key" x="40" y="372" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 382) scale(0.833333)"><path d="M12 4v16M7 20h10M5 7h14M7.5 7L4.5 13a3 3 0 0 0 6 0zM16.5 7l-3 6a3 3 0 0 0 6 0z"/></g>
  <text class="name" x="82" y="396">Spending policy</text>
  <text x="200" y="396">per-payment and daily caps, allowed merchants</text>
  <g class="line"><path d="M132 412V476" marker-end="url(#agent-wallet-a-arrow)"/></g>
  <rect class="box green" x="24" y="476" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(36 487) scale(0.833333)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="name" x="66" y="500">Paid APIs</text>
  <text class="note" x="66" y="516">Charge per call over x402</text>
  <g class="line"><path d="M380 412V476" marker-end="url(#agent-wallet-a-arrow)"/></g>
  <rect class="box green" x="272" y="476" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(284 487) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="314" y="500">Online stores</text>
  <text class="note" x="314" y="516">Card checkout with a</text>
  <text class="note" x="314" y="532">network token</text>
  <g class="line"><path d="M628 412V476" marker-end="url(#agent-wallet-a-arrow)"/></g>
  <rect class="box green" x="520" y="476" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(532 487) scale(0.833333)"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M3 12.5v3M21 12.5v3M9.5 13v1M14.5 13v1"/><circle cx="12" cy="3.5" r="1"/></g>
  <text class="name" x="562" y="500">Other agents</text>
  <text class="note" x="562" y="516">Get paid for a finished</text>
  <text class="note" x="562" y="532">task</text>
  <text class="note" x="388" y="456">payments within policy</text>
</svg>
