  <text class="small" x="442" y="297">Success</text>
  <rect class="box rose" x="570" y="176" width="166" height="40" rx="8"/>
  <g class="icon rose" transform="translate(582 186) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
