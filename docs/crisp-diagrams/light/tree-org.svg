  <g class="icon amber" transform="translate(218 186) scale(0.833333)"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/></g>
  <text class="name" x="248" y="200">Finance</text>
  <rect class="box amber" x="226" y="232" width="146" height="34" rx="8"/>
  <g class="icon amber" transform="translate(236 241) scale(0.666667)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="small" x="260" y="253">Payments ops</text>
  <rect class="box amber" x="226" y="276" width="146" height="34" rx="8"/>
  <g class="icon amber" transform="translate(236 285) scale(0.666667)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="small" x="260" y="297">Accounting</text>
  <rect class="box green" x="388" y="176" width="166" height="40" rx="8"/>
  <g class="icon green" transform="translate(400 186) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="430" y="200">Customers</text>
  <rect class="box green" x="408" y="232" width="146" height="34" rx="8"/>
  <g class="icon green" transform="translate(418 241) scale(0.666667)"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5.5A1.5 1.5 0 0 1 4 17.5zM20 14h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5zM17 19c0 1.5-2 2.5-5 2.5"/></g>
