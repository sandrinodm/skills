  <text class="name" x="302" y="96">Organization</text>
  <text class="note" x="302" y="112">Security policies set here</text>
  <rect class="box teal" x="24" y="176" width="216" height="56" rx="8"/>
  <rect class="badge teal" x="36" y="188" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(42 194) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="80" y="200">Production</text>
