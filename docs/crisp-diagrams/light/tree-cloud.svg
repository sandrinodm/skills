  <rect class="box teal" x="292" y="248" width="196" height="34" rx="8"/>
  <g class="icon teal" transform="translate(302 257) scale(0.666667)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="small" x="326" y="269">Payments staging</text>
  <rect class="box teal" x="292" y="292" width="196" height="34" rx="8"/>
  <g class="icon teal" transform="translate(302 301) scale(0.666667)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="small" x="326" y="313">Identity staging</text>
  <rect class="box teal" x="520" y="176" width="216" height="56" rx="8"/>
  <rect class="badge teal" x="532" y="188" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(538 194) scale(0.833333)"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/></g>
  <text class="name" x="576" y="200">Shared</text>
  <text class="note" x="576" y="216">Used by everyone</text>
  <rect class="box teal" x="540" y="248" width="196" height="34" rx="8"/>
  <g class="icon teal" transform="translate(550 257) scale(0.666667)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="small" x="574" y="269">Logging</text>
  <rect class="box teal" x="540" y="292" width="196" height="34" rx="8"/>
  <g class="icon teal" transform="translate(550 301) scale(0.666667)"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/></g>
  <text class="small" x="574" y="313">Networking</text>
