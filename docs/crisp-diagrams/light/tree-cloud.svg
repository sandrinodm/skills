  <rect class="badge teal" x="284" y="188" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(290 194) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
