<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408" role="img" aria-label="Guardrails sit above everything an agent can do">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="agent-stack-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Guardrails sit above everything an agent can do</text>
  <text class="note" x="24" y="54">The layers of a typical AI agent, from the model up</text>
  <rect class="key" x="24" y="72" width="712" height="56" rx="8"/>
  <g class="icon accent" transform="translate(40 90) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="72" y="94">Guardrails</text>
  <text class="small" x="72" y="114">Approvals, limits and audit logs</text>
  <rect class="chip teal" x="497" y="87" width="114" height="26" rx="13"/>
  <text class="small mid" x="554" y="104">Human approval</text>
  <rect class="chip teal" x="619" y="87" width="101" height="26" rx="13"/>
  <text class="small mid" x="669.5" y="104">Spend limits</text>
  <rect class="box violet" x="24" y="136" width="712" height="56" rx="8"/>
  <rect class="badge violet" x="36" y="148" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 154) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
  <text class="name" x="80" y="158">Tools</text>
  <text class="small" x="80" y="178">Acts in other systems</text>
  <rect class="chip teal" x="542" y="151" width="43" height="26" rx="13"/>
  <text class="small mid" x="563.5" y="168">MCP</text>
  <rect class="chip teal" x="593" y="151" width="69" height="26" rx="13"/>
  <text class="small mid" x="627.5" y="168">Browser</text>
  <rect class="chip teal" x="670" y="151" width="50" height="26" rx="13"/>
  <text class="small mid" x="695" y="168">Code</text>
  <rect class="box violet" x="24" y="200" width="712" height="56" rx="8"/>
  <rect class="badge violet" x="36" y="212" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 218) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
  <text class="name" x="80" y="222">Memory</text>
  <text class="small" x="80" y="242">Remembers people and past work</text>
  <rect class="chip teal" x="536" y="215" width="75" height="26" rx="13"/>
  <text class="small mid" x="573.5" y="232">Profiles</text>
  <rect class="chip teal" x="619" y="215" width="101" height="26" rx="13"/>
  <text class="small mid" x="669.5" y="232">Vector store</text>
  <rect class="box violet" x="24" y="264" width="712" height="56" rx="8"/>
  <rect class="badge violet" x="36" y="276" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 282) scale(0.833333)"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
  <text class="name" x="80" y="286">Planning</text>
  <text class="small" x="80" y="306">Breaks a goal into steps</text>
  <rect class="chip teal" x="587" y="279" width="56" height="26" rx="13"/>
  <text class="small mid" x="615" y="296">Plans</text>
  <rect class="chip teal" x="651" y="279" width="69" height="26" rx="13"/>
  <text class="small mid" x="685.5" y="296">Retries</text>
  <rect class="box violet" x="24" y="328" width="712" height="56" rx="8"/>
  <rect class="badge violet" x="36" y="340" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 346) scale(0.833333)"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/><path d="M19 15.5c.2 1.3.9 2 2.2 2.2-1.3.2-2 .9-2.2 2.2-.2-1.3-.9-2-2.2-2.2 1.3-.2 2-.9 2.2-2.2z"/></g>
  <text class="name" x="80" y="350">Model</text>
  <text class="small" x="80" y="370">Reads, reasons and writes</text>
  <rect class="chip teal" x="677" y="343" width="43" height="26" rx="13"/>
  <text class="small mid" x="698.5" y="360">LLM</text>
</svg>
