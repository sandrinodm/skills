<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-label="A card terminal encrypts the card number at the reader, before any app sees it">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="card-terminal-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A card terminal encrypts the card number at the reader, before any app sees it</text>
  <text class="note" x="24" y="54">The parts of a payment terminal at a shop counter</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><path d="M3 4h2.5l2.2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g>
  <text class="name" x="258" y="100">Shopper</text>
  <text class="note" x="258" y="116">Taps a card, phone or watch</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#card-terminal-b-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#card-terminal-b-arrow)"/></g>
  <text class="note end" x="332" y="156">card tap</text>
  <text class="note" x="428" y="156">approved or declined</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="256" rx="8"/>
  <text class="name" x="40" y="196">Payment terminal</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="52" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 230) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="96" y="236">Contactless reader</text>
  <text class="note" x="96" y="252">Reads the card or phone</text>
  <text class="note" x="96" y="268">over NFC</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="284" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(290 230) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
  <text class="name" x="328" y="236">PIN pad</text>
  <text class="note" x="328" y="252">A separate, secure input</text>
  <text class="note" x="328" y="268">for the PIN</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="516" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(522 230) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="560" y="236">Secure element</text>
  <text class="note" x="560" y="252">Holds the encryption</text>
  <text class="note" x="560" y="268">keys</text>
  <rect class="box teal" x="40" y="300" width="332" height="56" rx="8"/>
  <rect class="badge teal" x="52" y="312" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 318) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="96" y="324">Checkout app</text>
  <text class="note" x="96" y="340">Shows the amount, never the card number</text>
  <rect class="box teal" x="388" y="300" width="332" height="56" rx="8"/>
  <rect class="badge teal" x="400" y="312" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(406 318) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="444" y="324">Receipts</text>
  <text class="note" x="444" y="340">Printed, or sent by email</text>
  <rect class="key" x="40" y="372" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 382) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="82" y="396">Encryption at the reader</text>
  <text x="261" y="396">card data is encrypted the moment it's read</text>
  <g class="line"><path d="M132 412V476" marker-end="url(#card-terminal-b-arrow)"/></g>
  <rect class="box green" x="24" y="476" width="216" height="72" rx="8"/>
  <rect class="badge green" x="36" y="488" width="32" height="32" rx="9"/><g class="icon green" transform="translate(42 494) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="80" y="500">Payment processor</text>
  <text class="note" x="80" y="516">Decrypts it and asks the</text>
  <text class="note" x="80" y="532">network</text>
  <g class="line"><path d="M380 412V476" marker-end="url(#card-terminal-b-arrow)"/></g>
  <rect class="box green" x="272" y="476" width="216" height="72" rx="8"/>
  <rect class="badge green" x="284" y="488" width="32" height="32" rx="9"/><g class="icon green" transform="translate(290 494) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="328" y="500">Card network</text>
  <text class="note" x="328" y="516">Visa, Mastercard and</text>
  <text class="note" x="328" y="532">others</text>
  <g class="line"><path d="M628 412V476" marker-end="url(#card-terminal-b-arrow)"/></g>
  <rect class="box green" x="520" y="476" width="216" height="72" rx="8"/>
  <rect class="badge green" x="532" y="488" width="32" height="32" rx="9"/><g class="icon green" transform="translate(538 494) scale(0.833333)"><path d="M3 4h2.5l2.2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g>
  <text class="name" x="576" y="500">Merchant's system</text>
  <text class="note" x="576" y="516">Gets a token, not the</text>
  <text class="note" x="576" y="532">card number</text>
  <text class="note" x="388" y="456">encrypted card data</text>
</svg>
