  <g class="icon green" transform="translate(582 84) scale(0.75)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="606" y="98">Verified</text>
  <rect class="chip green" x="698" y="84" width="26" height="20" rx="10"/>
  <text class="small mid" x="711" y="98">1</text>
  <rect class="box green" x="578" y="116" width="150" height="56" rx="8"/>
  <text class="small strong" x="590" y="139">XSS in search</text>
  <text class="note" x="590" y="156">Fixed and retested</text>
</svg>
