  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <rect class="badge teal" x="516" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(522 230) scale(0.833333)"><path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/></g>
  <text class="name" x="560" y="236">Connectors</text>
  <text class="note" x="560" y="252">Signed-in access to each</text>
  <text class="note" x="560" y="268">app</text>
  <rect class="box teal" x="40" y="300" width="332" height="56" rx="8"/>
  <rect class="badge teal" x="52" y="312" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 318) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
