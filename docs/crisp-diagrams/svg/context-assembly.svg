<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408" role="img" aria-label="Every turn, an agent rebuilds its context and shrinks old conversation to make room">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="context-assembly-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every turn, an agent rebuilds its context and shrinks old conversation to make room</text>
  <text class="note" x="24" y="54">The layers that make up an agent's context window, top to bottom</text>
  <rect class="box violet" x="24" y="72" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="94">Instructions</text>
  <text class="small" x="40" y="114">Rules, role and tone</text>
  <rect class="chip teal" x="613" y="87" width="107" height="26" rx="13"/>
  <text class="small mid" x="666.5" y="104">System prompt</text>
  <rect class="box violet" x="24" y="136" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="158">Tools</text>
  <text class="small" x="40" y="178">What it can call, with schemas</text>
  <rect class="chip teal" x="587" y="151" width="43" height="26" rx="13"/>
  <text class="small mid" x="608.5" y="168">MCP</text>
  <rect class="chip teal" x="638" y="151" width="82" height="26" rx="13"/>
  <text class="small mid" x="679" y="168">Functions</text>
  <rect class="box violet" x="24" y="200" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="222">Memory</text>
  <text class="small" x="40" y="242">Facts saved in earlier sessions</text>
  <rect class="chip teal" x="587" y="215" width="56" height="26" rx="13"/>
  <text class="small mid" x="615" y="232">Notes</text>
  <rect class="chip teal" x="651" y="215" width="69" height="26" rx="13"/>
  <text class="small mid" x="685.5" y="232">Profile</text>
  <rect class="box violet" x="24" y="264" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="286">Retrieved</text>
  <text class="small" x="40" y="306">Documents for this question</text>
  <rect class="chip teal" x="594" y="279" width="62" height="26" rx="13"/>
  <text class="small mid" x="625" y="296">Search</text>
  <rect class="chip teal" x="664" y="279" width="56" height="26" rx="13"/>
  <text class="small mid" x="692" y="296">Files</text>
  <rect class="key" x="24" y="328" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="350">Conversation</text>
  <text class="small" x="40" y="370">Recent turns; older ones summarized</text>
  <rect class="chip teal" x="555" y="343" width="69" height="26" rx="13"/>
  <text class="small mid" x="589.5" y="360">Summary</text>
  <rect class="chip teal" x="632" y="343" width="88" height="26" rx="13"/>
  <text class="small mid" x="676" y="360">Last turns</text>
</svg>
