<svg xmlns="http://www.w3.org/2000/svg" width="760" height="556" viewBox="0 0 760 556" role="img" aria-label="A work agent acts across company apps, inside the rules IT sets">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="work-agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A work agent acts across company apps, inside the rules IT sets</text>
  <text class="note" x="24" y="54">What a company-approved AI agent is made of</text>
  <rect class="box violet" x="66" y="76" width="280" height="56" rx="8"/>
  <text class="name mid" x="206" y="100">Employees</text>
  <text class="note mid" x="206" y="116">Ask for tasks in Slack or the web app</text>
  <g class="line"><path d="M206 132V172" marker-end="url(#work-agent-arrow)"/></g>
  <text class="note" x="214" y="156">tasks</text>
  <rect class="box violet" x="414" y="76" width="280" height="56" rx="8"/>
  <text class="name mid" x="554" y="100">IT admins</text>
  <text class="note mid" x="554" y="116">Choose the apps, scopes and rules</text>
  <g class="line"><path d="M554 132V172" marker-end="url(#work-agent-arrow)"/></g>
  <text class="note" x="562" y="156">policies</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="256" rx="8"/>
  <text class="name" x="40" y="196">Work agent</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="52" y="236">Model</text>
  <text class="note" x="52" y="252">Plans the task and writes the</text>
  <text class="note" x="52" y="268">result</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="236">Company memory</text>
  <text class="note" x="284" y="252">Docs and decisions it's allowed</text>
  <text class="note" x="284" y="268">to use</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <text class="name" x="516" y="236">Connectors</text>
  <text class="note" x="516" y="252">Signed-in access to each app</text>
  <rect class="box teal" x="40" y="300" width="332" height="56" rx="8"/>
  <text class="name" x="52" y="324">Approvals</text>
  <text class="note" x="52" y="340">Asks a person before risky steps</text>
  <rect class="box teal" x="388" y="300" width="332" height="56" rx="8"/>
  <text class="name" x="400" y="324">Audit log</text>
  <text class="note" x="400" y="340">Every action, with who asked for it</text>
  <rect class="key" x="40" y="372" width="680" height="40" rx="8"/>
  <text class="name" x="56" y="396">Policy engine</text>
  <text x="160" y="396">IT's rules decide what each request may touch</text>
  <g class="line"><path d="M107 412V476" marker-end="url(#work-agent-arrow)"/></g>
  <rect class="box green" x="24" y="476" width="166" height="56" rx="8"/>
  <text class="name" x="36" y="500">Slack</text>
  <text class="note" x="36" y="516">Messages</text>
  <g class="line"><path d="M289 412V476" marker-end="url(#work-agent-arrow)"/></g>
  <rect class="box green" x="206" y="476" width="166" height="56" rx="8"/>
  <text class="name" x="218" y="500">Google Drive</text>
  <text class="note" x="218" y="516">Docs and sheets</text>
  <g class="line"><path d="M471 412V476" marker-end="url(#work-agent-arrow)"/></g>
  <rect class="box green" x="388" y="476" width="166" height="56" rx="8"/>
  <text class="name" x="400" y="500">Salesforce</text>
  <text class="note" x="400" y="516">Customers</text>
  <g class="line"><path d="M653 412V476" marker-end="url(#work-agent-arrow)"/></g>
  <rect class="box green" x="570" y="476" width="166" height="56" rx="8"/>
  <text class="name" x="582" y="500">Jira</text>
  <text class="note" x="582" y="516">Tickets</text>
  <text class="note" x="297" y="456">allowed actions</text>
</svg>
