<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" role="img" aria-label="Everything in the store hangs off the order">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="erd-commerce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Everything in the store hangs off the order</text>
  <text class="note" x="24" y="54">Data model for an online store</text>
  <rect class="box violet" x="24" y="80" width="200" height="112" rx="8"/>
  <g class="icon violet" transform="translate(36 90) scale(0.833333)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></g>
  <text class="name" x="64" y="105">Customer</text>
  <g class="line"><path d="M24 118H224"/></g>
  <text class="small strong" x="36" y="135">id</text>
  <text class="note code end" x="212" y="135">uuid</text>
  <text class="small" x="36" y="157">email</text>
  <text class="note code end" x="212" y="157">text</text>
  <text class="small" x="36" y="179">created_at</text>
  <text class="note code end" x="212" y="179">time</text>
  <rect class="key" x="280" y="80" width="200" height="134" rx="8"/>
  <g class="icon accent" transform="translate(292 90) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="320" y="105">Order</text>
  <g class="line"><path d="M280 118H480"/></g>
  <text class="small strong" x="292" y="135">id</text>
  <text class="note code end" x="468" y="135">uuid</text>
  <text class="small" x="292" y="157">customer_id</text>
  <text class="note code end" x="468" y="157">→ customer</text>
  <text class="small" x="292" y="179">status</text>
  <text class="note code end" x="468" y="179">enum</text>
  <text class="small" x="292" y="201">total</text>
  <text class="note code end" x="468" y="201">money</text>
  <rect class="box teal" x="536" y="80" width="200" height="134" rx="8"/>
  <g class="icon teal" transform="translate(548 90) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="576" y="105">Payment</text>
  <g class="line"><path d="M536 118H736"/></g>
  <text class="small strong" x="548" y="135">id</text>
  <text class="note code end" x="724" y="135">uuid</text>
  <text class="small" x="548" y="157">order_id</text>
  <text class="note code end" x="724" y="157">→ order</text>
  <text class="small" x="548" y="179">amount</text>
  <text class="note code end" x="724" y="179">money</text>
  <text class="small" x="548" y="201">status</text>
  <text class="note code end" x="724" y="201">enum</text>
  <rect class="box teal" x="280" y="270" width="200" height="134" rx="8"/>
  <g class="icon teal" transform="translate(292 280) scale(0.833333)"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
  <text class="name" x="320" y="295">Order item</text>
  <g class="line"><path d="M280 308H480"/></g>
  <text class="small strong" x="292" y="325">id</text>
  <text class="note code end" x="468" y="325">uuid</text>
  <text class="small" x="292" y="347">order_id</text>
  <text class="note code end" x="468" y="347">→ order</text>
  <text class="small" x="292" y="369">product_id</text>
  <text class="note code end" x="468" y="369">→ product</text>
  <text class="small" x="292" y="391">quantity</text>
  <text class="note code end" x="468" y="391">int</text>
  <rect class="box amber" x="24" y="270" width="200" height="112" rx="8"/>
  <g class="icon amber" transform="translate(36 280) scale(0.833333)"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></g>
  <text class="name" x="64" y="295">Product</text>
  <g class="line"><path d="M24 308H224"/></g>
  <text class="small strong" x="36" y="325">id</text>
  <text class="note code end" x="212" y="325">uuid</text>
  <text class="small" x="36" y="347">name</text>
  <text class="note code end" x="212" y="347">text</text>
  <text class="small" x="36" y="369">price</text>
  <text class="note code end" x="212" y="369">money</text>
  <rect class="box green" x="536" y="270" width="200" height="112" rx="8"/>
  <g class="icon green" transform="translate(548 280) scale(0.833333)"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></g>
  <text class="name" x="576" y="295">Shipment</text>
  <g class="line"><path d="M536 308H736"/></g>
  <text class="small strong" x="548" y="325">id</text>
  <text class="note code end" x="724" y="325">uuid</text>
  <text class="small" x="548" y="347">order_id</text>
  <text class="note code end" x="724" y="347">→ order</text>
  <text class="small" x="548" y="369">carrier</text>
  <text class="note code end" x="724" y="369">text</text>
  <g class="line"><path d="M224 99H280"/></g>
  <text class="small" x="230" y="93">1</text>
  <text class="small end" x="274" y="93">n</text>
  <g class="line"><path d="M480 99H536"/></g>
  <text class="small" x="486" y="93">1</text>
  <text class="small end" x="530" y="93">n</text>
  <g class="line"><path d="M380 214V270"/></g>
  <text class="small" x="386" y="230">1</text>
  <text class="small" x="386" y="264">n</text>
  <g class="line"><path d="M224 289H280"/></g>
  <text class="small" x="230" y="283">1</text>
  <text class="small end" x="274" y="283">n</text>
  <g class="line"><path d="M420 214V242H596V270"/></g>
  <text class="small" x="426" y="228">1</text>
  <text class="small" x="602" y="264">1</text>
</svg>
