<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-label="Every agent action becomes an event that audit, billing and evaluation consume">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--key-fill:#1e2f45;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="events-agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every agent action becomes an event that audit, billing and evaluation consume</text>
  <text class="note" x="24" y="54">Event-driven logging for an AI agent platform</text>
  <rect class="box violet" x="24" y="72" width="216" height="56" rx="8"/>
  <rect class="badge violet" x="36" y="84" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(42 90) scale(0.833333)"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M3 12.5v3M21 12.5v3M9.5 13v1M14.5 13v1"/><circle cx="12" cy="3.5" r="1"/></g>
  <text class="name" x="80" y="96">Agent runtime</text>
  <text class="note" x="80" y="112">Tool calls and results</text>
  <rect class="box violet" x="272" y="72" width="216" height="56" rx="8"/>
  <rect class="badge violet" x="284" y="84" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(290 90) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="328" y="96">Guard</text>
  <text class="note" x="328" y="112">Blocked actions</text>
  <rect class="box violet" x="520" y="72" width="216" height="56" rx="8"/>
  <rect class="badge violet" x="532" y="84" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(538 90) scale(0.833333)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
  <text class="name" x="576" y="96">Scheduler</text>
  <text class="note" x="576" y="112">Jobs that start</text>
  <rect class="key" x="24" y="192" width="712" height="64" rx="8"/>
  <g class="icon accent" transform="translate(40 204) scale(0.916667)"><path d="M5.5 5h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g>
  <text class="name" x="72" y="220">Agent event log</text>
  <text class="small" x="72" y="238">Append-only and replayable</text>
  <rect class="chip amber" x="592" y="211" width="70" height="26" rx="13"/>
  <text class="small code mid" x="627" y="228">actions</text>
  <rect class="chip amber" x="670" y="211" width="50" height="26" rx="13"/>
  <text class="small code mid" x="695" y="228">jobs</text>
  <rect class="box green" x="24" y="320" width="166" height="72" rx="8"/>
  <rect class="badge green" x="36" y="332" width="32" height="32" rx="9"/><g class="icon green" transform="translate(42 338) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="80" y="344">Audit log</text>
  <text class="note" x="80" y="360">Who did what</text>
  <rect class="box green" x="206" y="320" width="166" height="72" rx="8"/>
  <rect class="badge green" x="218" y="332" width="32" height="32" rx="9"/><g class="icon green" transform="translate(224 338) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="262" y="344">Usage billing</text>
  <text class="note" x="262" y="360">Counts tool</text>
  <text class="note" x="262" y="376">calls</text>
  <rect class="box green" x="388" y="320" width="166" height="72" rx="8"/>
  <rect class="badge green" x="400" y="332" width="32" height="32" rx="9"/><g class="icon green" transform="translate(406 338) scale(0.833333)"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g>
  <text class="name" x="444" y="344">Notifications</text>
  <text class="note" x="444" y="360">Tells the owner</text>
  <rect class="box green" x="570" y="320" width="166" height="72" rx="8"/>
  <rect class="badge green" x="582" y="332" width="32" height="32" rx="9"/><g class="icon green" transform="translate(588 338) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="626" y="344">Evaluation</text>
  <text class="note" x="626" y="360">Scores runs</text>
  <g class="line"><path d="M132 128V192" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code" x="140" y="164">tool.called</text>
  <g class="line"><path d="M380 128V192" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code" x="388" y="164">action.blocked</text>
  <g class="line"><path d="M628 128V192" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code end" x="620" y="164">job.started</text>
  <g class="line"><path d="M107 256V320" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code" x="115" y="292">on all</text>
  <g class="line"><path d="M289 256V320" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code" x="297" y="292">on tool.*</text>
  <g class="line"><path d="M471 256V320" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code" x="479" y="292">on blocked</text>
  <g class="line"><path d="M653 256V320" marker-end="url(#events-agent-arrow)"/></g>
  <text class="small code end" x="645" y="292">on job.*</text>
</svg>
