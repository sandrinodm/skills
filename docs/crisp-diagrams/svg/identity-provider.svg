<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-label="Every sign-in passes a risk check before the identity provider issues tokens">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="identity-provider-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every sign-in passes a risk check before the identity provider issues tokens</text>
  <text class="note" x="24" y="54">The parts of a customer identity provider behind the login page</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <text class="name mid" x="380" y="100">Your apps</text>
  <text class="note mid" x="380" y="116">Web, mobile and partner portals send users here</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#identity-provider-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#identity-provider-arrow)"/></g>
  <text class="note end" x="332" y="156">sign-in requests</text>
  <text class="note" x="428" y="156">ID and access tokens</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="272" rx="8"/>
  <text class="name" x="40" y="196">Identity provider</text>
  <rect class="key" x="40" y="212" width="680" height="40" rx="8"/>
  <text class="name" x="56" y="236">Risk check</text>
  <text x="140" y="236">scores each attempt; risky ones need a second factor</text>
  <rect class="box teal" x="40" y="268" width="216" height="72" rx="8"/>
  <text class="name" x="52" y="292">Login page</text>
  <text class="note" x="52" y="308">One sign-in screen for every app</text>
  <rect class="box teal" x="272" y="268" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="292">User store</text>
  <text class="note" x="284" y="308">Profiles, passwords and passkeys</text>
  <rect class="box teal" x="504" y="268" width="216" height="72" rx="8"/>
  <text class="name" x="516" y="292">MFA</text>
  <text class="note" x="516" y="308">Push, codes and passkeys as a</text>
  <text class="note" x="516" y="324">second factor</text>
  <rect class="box teal" x="40" y="356" width="216" height="72" rx="8"/>
  <text class="name" x="52" y="380">Connections</text>
  <text class="note" x="52" y="396">Google, Apple and company SSO</text>
  <rect class="box teal" x="272" y="356" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="380">Token service</text>
  <text class="note" x="284" y="396">Issues ID, access and refresh</text>
  <text class="note" x="284" y="412">tokens</text>
  <rect class="box teal" x="504" y="356" width="216" height="72" rx="8"/>
  <text class="name" x="516" y="380">Audit log</text>
  <text class="note" x="516" y="396">Who signed in, from where, and</text>
  <text class="note" x="516" y="412">how</text>
  <g class="line"><path d="M132 444V492" marker-end="url(#identity-provider-arrow)"/></g>
  <rect class="box green" x="24" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="36" y="516">Your APIs</text>
  <text class="note" x="36" y="532">Check the access token on every</text>
  <text class="note" x="36" y="548">call</text>
  <g class="line"><path d="M380 444V492" marker-end="url(#identity-provider-arrow)"/></g>
  <rect class="box green" x="272" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="284" y="516">CRM</text>
  <text class="note" x="284" y="532">Gets profile updates as they</text>
  <text class="note" x="284" y="548">happen</text>
  <g class="line"><path d="M628 444V492" marker-end="url(#identity-provider-arrow)"/></g>
  <rect class="box green" x="520" y="492" width="216" height="72" rx="8"/>
  <text class="name" x="532" y="516">Security team</text>
  <text class="note" x="532" y="532">Gets alerts on suspicious</text>
  <text class="note" x="532" y="548">sign-ins</text>
  <text class="note" x="388" y="472">tokens and events</text>
</svg>
