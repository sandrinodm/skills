<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" role="img" aria-label="A remote MCP server asks for a token, never for the user&#x27;s password">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="mcp-authorization-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A remote MCP server asks for a token, never for the user's password</text>
  <text class="note" x="24" y="54">How an MCP client gets authorized for a remote MCP server, following the MCP authorization spec</text>
  <g class="life"><line x1="88" x2="88" y1="124" y2="532"/></g>
  <g class="life"><line x1="234" x2="234" y1="124" y2="532"/></g>
  <g class="life"><line x1="380" x2="380" y1="124" y2="532"/></g>
  <g class="life"><line x1="526" x2="526" y1="124" y2="532"/></g>
  <g class="life"><line x1="672" x2="672" y1="124" y2="532"/></g>
  <rect class="box violet" x="24" y="72" width="128" height="52" rx="8"/>
  <text class="name mid" x="88" y="94">User</text>
  <text class="note mid" x="88" y="112">approves access</text>
  <rect class="box teal" x="170" y="72" width="128" height="52" rx="8"/>
  <text class="name mid" x="234" y="94">MCP client</text>
  <text class="note mid" x="234" y="112">for example, Claude</text>
  <rect class="box amber" x="316" y="72" width="128" height="52" rx="8"/>
  <text class="name mid" x="380" y="94">MCP server</text>
  <text class="note mid" x="380" y="112">a remote server</text>
  <rect class="box rose" x="462" y="72" width="128" height="52" rx="8"/>
  <text class="name mid" x="526" y="94">Auth server</text>
  <text class="note mid" x="526" y="112">issues tokens</text>
  <rect class="box green" x="608" y="72" width="128" height="52" rx="8"/>
  <text class="name mid" x="672" y="94">SaaS API</text>
  <text class="note mid" x="672" y="112">behind the server</text>
  <g class="line"><path d="M234 172H378" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small mid" x="307" y="164">1 Calls a tool</text>
  <g class="line"><path d="M380 220H236" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small mid" x="307" y="212">2 401, with metadata</text>
  <g class="line"><path d="M234 268H524" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small" x="246" y="260">3 Starts OAuth with PKCE</text>
  <g class="line"><path d="M88 316H524" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small" x="100" y="308">4 Signs in and consents</text>
  <g class="line"><path d="M526 364H236" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small end" x="514" y="356">5 Token for this server</text>
  <g class="line"><path d="M234 412H378" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small mid" x="307" y="404">6 Calls the tool again</text>
  <rect class="key" x="270" y="428" width="220" height="48" rx="8"/>
  <text class="small strong mid" x="380" y="448">7 Checks the token</text>
  <text class="small mid" x="380" y="464">its audience must be this server</text>
  <g class="line"><path d="M380 508H670" marker-end="url(#mcp-authorization-arrow)"/></g>
  <text class="small" x="392" y="500">8 Calls the API</text>
  <rect class="callout" x="24" y="552" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="574">One token per server</text>
  <text class="small" x="40" y="594">Tokens are bound to one MCP server, so a compromised server can't replay them against another</text>
</svg>
