<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-label="The agent calls a tool; the MCP server turns it into an API call it controls">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="agent-mcp-api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">The agent calls a tool; the MCP server turns it into an API call it controls</text>
  <text class="note" x="24" y="54">From a chat request to a restaurant booking</text>
  <g transform="translate(24 80)"><rect class="device" x="0" y="0" width="150" height="300" rx="24"/><rect class="screen" x="7" y="7" width="136" height="286" rx="18"/><rect class="island" x="56" y="15" width="38" height="11" rx="5.5"/><text class="uitext strong mid" x="75" y="52">Assistant</text><rect class="btn" x="31.8" y="66" width="101.2" height="36" rx="9"/><text class="uitext inv" x="40.8" y="82">Table for 4 at 8</text><text class="uitext inv" x="40.8" y="95">tonight?</text><rect class="field" x="17" y="110" width="106.4" height="62" rx="9"/><text class="uitext" x="26" y="126">Booked: Luca's at</text><text class="uitext" x="26" y="139">20:00.</text><text class="uitext" x="26" y="152">Confirmation</text><text class="uitext" x="26" y="165">sent.</text><rect class="field" x="17" y="248" width="116" height="24" rx="12"/><text class="uinote" x="29" y="264">Message</text><rect class="ui" x="56" y="283" width="38" height="3" rx="1.5"/></g>
  <g transform="translate(230 198)"><path class="glyph" d="M28 3V12"/><circle class="btn" cx="28" cy="3" r="3"/><rect class="device violet" x="4" y="12" width="48" height="40" rx="12"/><circle class="btn" cx="20" cy="31" r="3.5"/><circle class="btn" cx="36" cy="31" r="3.5"/><path class="glyph" d="M22 41H34"/></g>
  <rect class="key" x="368" y="180" width="116" height="100" rx="12"/>
  <g transform="translate(376 188)"><rect class="device teal" x="0" y="0" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="12" r="3"/><circle class="ui" cx="25" cy="12" r="3"/><rect class="ui" x="62" y="10" width="26" height="4" rx="2"/><rect class="device teal" x="0" y="30" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="42" r="3"/><circle class="ui" cx="25" cy="42" r="3"/><rect class="ui" x="62" y="40" width="26" height="4" rx="2"/><rect class="device teal" x="0" y="60" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="72" r="3"/><circle class="ui" cx="25" cy="72" r="3"/><rect class="ui" x="62" y="70" width="26" height="4" rx="2"/></g>
  <g transform="translate(620 188)"><rect class="device green" x="0" y="0" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="12" r="3"/><circle class="ui" cx="25" cy="12" r="3"/><rect class="ui" x="62" y="10" width="26" height="4" rx="2"/><rect class="device green" x="0" y="30" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="42" r="3"/><circle class="ui" cx="25" cy="42" r="3"/><rect class="ui" x="62" y="40" width="26" height="4" rx="2"/><rect class="device green" x="0" y="60" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="72" r="3"/><circle class="ui" cx="25" cy="72" r="3"/><rect class="ui" x="62" y="70" width="26" height="4" rx="2"/></g>
  <g class="line"><path d="M186 230H222" marker-end="url(#agent-mcp-api-arrow)"/></g>
  <g class="line"><path d="M294 218H356" marker-end="url(#agent-mcp-api-arrow)"/></g>
  <g class="line"><path d="M356 242H294" marker-end="url(#agent-mcp-api-arrow)"/></g>
  <rect class="field" x="287" y="190" width="76" height="22" rx="6"/>
  <text class="uitext code mid" x="325" y="205">book_table</text>
  <rect class="field" x="299" y="248" width="52" height="22" rx="6"/>
  <text class="uitext code mid" x="325" y="263">booked</text>
  <g class="line"><path d="M496 218H608" marker-end="url(#agent-mcp-api-arrow)"/></g>
  <g class="line"><path d="M608 242H496" marker-end="url(#agent-mcp-api-arrow)"/></g>
  <rect class="field" x="514" y="190" width="76" height="22" rx="6"/>
  <text class="uitext code mid" x="552" y="205">POST /book</text>
  <rect class="field" x="511" y="248" width="82" height="22" rx="6"/>
  <text class="uitext code mid" x="552" y="263">201 Created</text>
  <text class="name mid" x="99" y="404">You, in chat</text>
  <text class="note mid" x="99" y="420">Ask in plain words</text>
  <text class="name mid" x="258" y="404">Agent</text>
  <text class="note mid" x="258" y="420">Picks a tool</text>
  <text class="name mid" x="426" y="404">MCP server</text>
  <text class="note mid" x="426" y="420">Holds the API key and rules</text>
  <text class="name mid" x="670" y="404">Booking API</text>
  <text class="note mid" x="670" y="420">Never sees the agent</text>
</svg>
