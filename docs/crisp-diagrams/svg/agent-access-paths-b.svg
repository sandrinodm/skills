  <g class="icon amber" transform="translate(222 307) scale(0.75)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="name" x="248" y="320">REST API</text>
  <rect class="chip amber" x="224" y="336" width="69" height="26" rx="13"/>
