  <text class="small" x="76" y="340">HTTP client</text>
  <rect class="box violet" x="40" y="412" width="136" height="40" rx="8"/>
  <g class="icon violet" transform="translate(50 423) scale(0.75)"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></g>
  <text class="small" x="76" y="436">Its email</text>
  <rect class="box zone green" x="568" y="72" width="168" height="416" rx="8"/>
  <text class="name mid" x="652" y="96">Your company</text>
  <rect class="box green" x="584" y="124" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 135) scale(0.75)"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></g>
  <text class="small" x="620" y="148">Product data</text>
  <rect class="box green" x="584" y="220" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 231) scale(0.75)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g>
  <text class="small" x="620" y="244">Docs</text>
  <rect class="box green" x="584" y="316" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 327) scale(0.75)"><path d="M3 4h2.5l2.2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g>
  <text class="small" x="620" y="340">Orders</text>
  <rect class="box green" x="584" y="412" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 423) scale(0.75)"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5.5A1.5 1.5 0 0 1 4 17.5zM20 14h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5zM17 19c0 1.5-2 2.5-5 2.5"/></g>
  <text class="small" x="620" y="436">Support</text>
  <rect class="box amber" x="208" y="104" width="344" height="80" rx="8"/>
  <g class="icon amber" transform="translate(222 115) scale(0.75)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="248" y="128">MCP server</text>
  <rect class="chip amber" x="224" y="144" width="56" height="26" rx="13"/>
  <text class="small mid" x="252" y="161">Tools</text>
  <rect class="chip amber" x="288" y="144" width="82" height="26" rx="13"/>
  <text class="small mid" x="329" y="161">Resources</text>
  <g class="line"><path d="M176 144H208" marker-end="url(#agent-access-paths-b-arrow)"/></g>
  <g class="line"><path d="M552 144H584" marker-end="url(#agent-access-paths-b-arrow)"/></g>
  <rect class="box amber" x="208" y="200" width="344" height="80" rx="8"/>
  <g class="icon amber" transform="translate(222 211) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="name" x="248" y="224">Website</text>
  <rect class="chip amber" x="224" y="240" width="62" height="26" rx="13"/>
  <text class="small mid" x="255" y="257">WebMCP</text>
  <rect class="chip amber" x="294" y="240" width="75" height="26" rx="13"/>
  <text class="small mid" x="331.5" y="257">llms.txt</text>
  <g class="line"><path d="M176 240H208" marker-end="url(#agent-access-paths-b-arrow)"/></g>
  <g class="line"><path d="M552 240H584" marker-end="url(#agent-access-paths-b-arrow)"/></g>
