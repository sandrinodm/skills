<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-label="Scan the code with your phone, and the laptop signs in">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--key-fill:#1e2f45;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="qr-login-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Scan the code with your phone, and the laptop signs in</text>
  <text class="note" x="24" y="54">Cross-device sign-in with a QR code</text>
  <g transform="translate(24 145)"><rect class="device" x="0" y="0" width="260" height="170" rx="10"/><circle class="ui" cx="14" cy="14" r="3.5"/><circle class="ui" cx="26" cy="14" r="3.5"/><circle class="ui" cx="38" cy="14" r="3.5"/><path class="line" d="M0 28H260"/><rect class="field" x="52" y="6" width="196" height="16" rx="8"/><text class="uinote" x="62" y="18">acme.com/login</text><text class="uitext strong" x="20" y="58">Sign in to Acme</text><text class="uinote" x="20" y="74">Scan with your phone</text><g transform="translate(20 86)"><rect class="field" x="0" y="0" width="64" height="64" rx="4"/><rect class="btn" x="6" y="6" width="14" height="14" rx="2"/><rect class="field" x="9" y="9" width="8" height="8" rx="1"/><rect class="btn" x="11" y="11" width="4" height="4" rx="1"/><rect class="btn" x="44" y="6" width="14" height="14" rx="2"/><rect class="field" x="47" y="9" width="8" height="8" rx="1"/><rect class="btn" x="49" y="11" width="4" height="4" rx="1"/><rect class="btn" x="6" y="44" width="14" height="14" rx="2"/><rect class="field" x="9" y="47" width="8" height="8" rx="1"/><rect class="btn" x="11" y="49" width="4" height="4" rx="1"/><rect class="btn" x="26" y="8" width="4" height="4" rx="1"/><rect class="btn" x="32" y="14" width="4" height="4" rx="1"/><rect class="btn" x="26" y="20" width="4" height="4" rx="1"/><rect class="btn" x="38" y="26" width="4" height="4" rx="1"/><rect class="btn" x="26" y="32" width="4" height="4" rx="1"/><rect class="btn" x="44" y="32" width="4" height="4" rx="1"/><rect class="btn" x="32" y="38" width="4" height="4" rx="1"/><rect class="btn" x="50" y="44" width="4" height="4" rx="1"/><rect class="btn" x="26" y="46" width="4" height="4" rx="1"/><rect class="btn" x="38" y="50" width="4" height="4" rx="1"/><rect class="btn" x="50" y="54" width="4" height="4" rx="1"/><rect class="btn" x="32" y="54" width="4" height="4" rx="1"/></g><rect class="field" x="110" y="90" width="130" height="22" rx="6"/><text class="uinote" x="118" y="105">you@example.com</text><rect class="btn" x="110" y="120" width="130" height="22" rx="6"/><text class="btn-text mid" x="175" y="135">Continue</text></g>
  <g transform="translate(390 188)"><rect class="device teal" x="0" y="0" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="12" r="3"/><circle class="ui" cx="25" cy="12" r="3"/><rect class="ui" x="62" y="10" width="26" height="4" rx="2"/><rect class="device teal" x="0" y="30" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="42" r="3"/><circle class="ui" cx="25" cy="42" r="3"/><rect class="ui" x="62" y="40" width="26" height="4" rx="2"/><rect class="device teal" x="0" y="60" width="100" height="24" rx="6"/><circle class="ui" cx="14" cy="72" r="3"/><circle class="ui" cx="25" cy="72" r="3"/><rect class="ui" x="62" y="70" width="26" height="4" rx="2"/></g>
  <g transform="translate(570 80)"><rect class="device" x="0" y="0" width="150" height="300" rx="24"/><rect class="screen" x="7" y="7" width="136" height="286" rx="18"/><rect class="island" x="56" y="15" width="38" height="11" rx="5.5"/><circle class="ui" cx="75" cy="70" r="14"/><text class="uitext strong mid" x="75" y="106">Sign in on your</text><text class="uitext strong mid" x="75" y="119">laptop?</text><text class="uinote mid" x="75" y="136">Chrome on MacBook Air</text><rect class="field" x="17" y="170" width="116" height="26" rx="7"/><text class="uitext mid" x="75" y="187">Not me</text><rect class="key" x="11" y="206" width="128" height="38" rx="10"/><rect class="btn" x="17" y="212" width="116" height="26" rx="7"/><text class="btn-text mid" x="75" y="229">Sign in</text><rect class="ui" x="56" y="283" width="38" height="3" rx="1.5"/></g>
  <g class="line"><path d="M558 230H502" marker-end="url(#qr-login-arrow)"/></g>
  <rect class="field" x="498" y="202" width="64" height="22" rx="6"/>
  <text class="uitext code mid" x="530" y="217">approval</text>
  <g class="line"><path d="M378 230H296" marker-end="url(#qr-login-arrow)"/></g>
  <rect class="field" x="308" y="202" width="58" height="22" rx="6"/>
  <text class="uitext code mid" x="337" y="217">session</text>
  <text class="name mid" x="154" y="404">Laptop browser</text>
  <text class="note mid" x="154" y="420">Shows a QR code</text>
  <text class="name mid" x="440" y="404">acme.com</text>
  <text class="note mid" x="440" y="420">Pairs the two devices</text>
  <text class="name mid" x="645" y="404">Your phone</text>
  <text class="note mid" x="645" y="420">Approves with a passkey</text>
</svg>
