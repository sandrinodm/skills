<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-label="Passkeys leave nothing on the server worth stealing">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="passkeys-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Passkeys leave nothing on the server worth stealing</text>
  <text class="note" x="24" y="54">Passwords and passkeys compared, from the user's side and the server's</text>
  <rect class="box rose" x="24" y="72" width="344" height="270" rx="8"/>
  <rect class="badge rose" x="40" y="86" width="32" height="32" rx="9"/><g class="icon rose" transform="translate(46 92) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="84" y="98">Passwords</text>
  <text class="note" x="84" y="114">Something you know</text>
  <rect class="box teal" x="392" y="72" width="344" height="270" rx="8"/>
  <rect class="badge teal" x="408" y="86" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(414 92) scale(0.833333)"><path d="M7 11a5 5 0 0 1 10 0c0 3-.5 5.5-1.5 7.5"/><path d="M9.5 11a2.5 2.5 0 0 1 5 0c0 3.5-.8 6-2 8.5"/><path d="M12 11c0 3-.6 6-2 9"/><path d="M4.5 14c-.3-1-.5-2-.5-3a8 8 0 0 1 14.5-4.6"/><path d="M7 18.5c.7-1.2 1-2.6 1-4"/></g>
  <text class="name" x="452" y="98">Passkeys</text>
  <text class="note" x="452" y="114">A key pair on your device</text>
  <text class="note" x="40" y="160">What the server stores</text>
  <text class="small" x="40" y="178">A hash of the password</text>
  <text class="note" x="408" y="160">What the server stores</text>
  <text class="small" x="408" y="178">A public key</text>
  <text class="note" x="40" y="208">Phishing</text>
  <text class="small" x="40" y="226">You can type it into a fake site</text>
  <text class="note" x="408" y="208">Phishing</text>
  <text class="small" x="408" y="226">Bound to the real site's domain</text>
  <text class="note" x="40" y="256">Reuse across sites</text>
  <text class="small" x="40" y="274">Common, so one breach spreads</text>
  <text class="note" x="408" y="256">Reuse across sites</text>
  <text class="small" x="408" y="274">A new key pair for every site</text>
  <text class="note" x="40" y="304">Signing in</text>
  <text class="small" x="40" y="322">Type it, then a second factor</text>
  <text class="note" x="408" y="304">Signing in</text>
  <text class="small" x="408" y="322">Face, fingerprint or device PIN</text>
  <rect class="key" x="24" y="366" width="712" height="56" rx="8"/>
  <g class="icon accent" transform="translate(704 384) scale(0.833333)"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M7.5 7h1.5M7.5 17h1.5"/></g>
  <text class="name" x="40" y="388">If the server is breached</text>
  <text class="small" x="40" y="408">Hashes can be cracked offline</text>
  <text class="small" x="408" y="408">Public keys are useless to an attacker</text>
</svg>
