<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-label="A credential wallet shares only the claims you approve">
  <style>
/* crisp-diagrams theme: zones: colored washes on areas, white boxes inside. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--key-fill:#e3eefa;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--key-fill:#1e2f45;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--key-fill);stroke:var(--accent);stroke-width:2}
.chip{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:var(--tint)}
.box.blue,.chip.blue{stroke:var(--blue-line)}
.box.green,.chip.green{stroke:var(--green-line)}
.box.violet,.chip.violet{stroke:var(--violet-line)}
.box.amber,.chip.amber{stroke:var(--amber-line)}
.box.rose,.chip.rose{stroke:var(--rose-line)}
.box.teal,.chip.teal{stroke:var(--teal-line)}
.box.zone.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.zone.green{fill:var(--green);stroke:var(--green-line)}
.box.zone.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.zone.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.zone.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.zone.teal{fill:var(--teal);stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{stroke:var(--blue-line)}
.device.green{stroke:var(--green-line)}
.device.violet{stroke:var(--violet-line)}
.device.amber{stroke:var(--amber-line)}
.device.rose{stroke:var(--rose-line)}
.device.teal{stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--blue)}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--green)}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--violet)}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--amber)}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--rose)}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--teal)}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="credential-wallet-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A credential wallet shares only the claims you approve</text>
  <text class="note" x="24" y="54">What a verifiable credential wallet on your phone is made of</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name" x="258" y="100">You, on your phone</text>
  <text class="note" x="258" y="116">Add credentials and approve each request</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#credential-wallet-b-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#credential-wallet-b-arrow)"/></g>
  <text class="note end" x="332" y="156">approvals</text>
  <text class="note" x="428" y="156">requests to share</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="272" rx="8"/>
  <text class="name" x="40" y="196">Credential wallet</text>
  <rect class="box teal" x="40" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 223) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="82" y="236">Credentials</text>
  <text class="note" x="82" y="252">Driver's license, diploma,</text>
  <text class="note" x="82" y="268">employee badge</text>
  <rect class="box teal" x="272" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(284 223) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="314" y="236">Secure keys</text>
  <text class="note" x="314" y="252">Bound to the phone's secure</text>
  <text class="note" x="314" y="268">hardware</text>
  <rect class="box teal" x="504" y="212" width="216" height="72" rx="8"/>
  <g class="icon teal" transform="translate(516 223) scale(0.833333)"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/></g>
  <text class="name" x="546" y="236">Proof builder</text>
  <text class="note" x="546" y="252">Reveals only the claims a</text>
  <text class="note" x="546" y="268">verifier asks for</text>
  <rect class="box teal" x="40" y="300" width="332" height="72" rx="8"/>
  <g class="icon teal" transform="translate(52 311) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="82" y="324">Trusted issuers</text>
  <text class="note" x="82" y="340">Which issuers the wallet accepts credentials</text>
  <text class="note" x="82" y="356">from</text>
  <rect class="box teal" x="388" y="300" width="332" height="72" rx="8"/>
  <g class="icon teal" transform="translate(400 311) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="430" y="324">Activity</text>
  <text class="note" x="430" y="340">What you shared, with whom, and when</text>
  <rect class="key" x="40" y="388" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 398) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="82" y="412">Consent screen</text>
  <text x="193" y="412">shows exactly which claims leave, and to whom</text>
  <g class="line"><path d="M132 428V492" marker-end="url(#credential-wallet-b-arrow)"/></g>
  <rect class="box green" x="24" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(36 503) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name" x="66" y="516">Online services</text>
  <text class="note" x="66" y="532">Ask for proof of age or</text>
  <text class="note" x="66" y="548">identity</text>
  <g class="line"><path d="M380 428V492" marker-end="url(#credential-wallet-b-arrow)"/></g>
  <rect class="box green" x="272" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(284 503) scale(0.833333)"><path d="M3 4h2.5l2.2 10.5h10l2-7.5H7"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g>
  <text class="name" x="314" y="516">Shops and venues</text>
  <text class="note" x="314" y="532">Check a proof in person</text>
  <text class="note" x="314" y="548">over NFC or QR</text>
  <g class="line"><path d="M628 428V492" marker-end="url(#credential-wallet-b-arrow)"/></g>
  <rect class="box green" x="520" y="492" width="216" height="72" rx="8"/>
  <g class="icon green" transform="translate(532 503) scale(0.833333)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="562" y="516">Status lists</text>
  <text class="note" x="562" y="532">Say whether a credential</text>
  <text class="note" x="562" y="548">was revoked</text>
  <text class="note" x="388" y="472">only approved claims</text>
</svg>
