<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" role="img" aria-label="An agent reaches your app through one of three doors, each with its own sign-in">
  <style>
/* crisp-diagrams theme: pastel: flat soft fills per group. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:none}
.box.blue,.chip.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.green,.chip.green{fill:var(--green);stroke:var(--green-line)}
.box.violet,.chip.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.amber,.chip.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.rose,.chip.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.teal,.chip.teal{fill:var(--teal);stroke:var(--teal-line)}
.box.zone.blue{fill:none;stroke:var(--blue-line)}
.box.zone.green{fill:none;stroke:var(--green-line)}
.box.zone.violet{fill:none;stroke:var(--violet-line)}
.box.zone.amber{fill:none;stroke:var(--amber-line)}
.box.zone.rose{fill:none;stroke:var(--rose-line)}
.box.zone.teal{fill:none;stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{fill:var(--blue);stroke:var(--blue-line)}
.device.green{fill:var(--green);stroke:var(--green-line)}
.device.violet{fill:var(--violet);stroke:var(--violet-line)}
.device.amber{fill:var(--amber);stroke:var(--amber-line)}
.device.rose{fill:var(--rose);stroke:var(--rose-line)}
.device.teal{fill:var(--teal);stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--paper);stroke:var(--blue-line);stroke-width:1}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--paper);stroke:var(--green-line);stroke-width:1}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--paper);stroke:var(--violet-line);stroke-width:1}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--paper);stroke:var(--amber-line);stroke-width:1}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--paper);stroke:var(--rose-line);stroke-width:1}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--paper);stroke:var(--teal-line);stroke-width:1}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="agent-doors-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">An agent reaches your app through one of three doors, each with its own sign-in</text>
  <text class="note" x="24" y="54">Where each identity standard sits between an agent and your systems</text>
  <rect class="box zone violet" x="24" y="72" width="168" height="320" rx="8"/>
  <text class="name mid" x="108" y="96">AI agent</text>
  <rect class="box violet" x="40" y="124" width="136" height="40" rx="8"/>
  <g class="icon violet" transform="translate(50 135) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g>
  <text class="small" x="76" y="148">Its browser</text>
  <rect class="box violet" x="40" y="220" width="136" height="40" rx="8"/>
  <g class="icon violet" transform="translate(50 231) scale(0.75)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="small" x="76" y="244">Its API client</text>
  <rect class="box violet" x="40" y="316" width="136" height="40" rx="8"/>
  <g class="icon violet" transform="translate(50 327) scale(0.75)"><path d="M4 7.5V18a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-1.5zM4 7.5A2 2 0 0 1 6 5.5h11V9"/><circle cx="16.5" cy="14.5" r="1.2"/></g>
  <text class="small" x="76" y="340">Its wallet</text>
  <rect class="box zone green" x="568" y="72" width="168" height="320" rx="8"/>
  <text class="name mid" x="652" y="96">Your app</text>
  <rect class="box green" x="584" y="124" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 135) scale(0.75)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="small" x="620" y="148">Login page</text>
  <rect class="box green" x="584" y="220" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 231) scale(0.75)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="small" x="620" y="244">Your API</text>
  <rect class="box green" x="584" y="316" width="136" height="40" rx="8"/>
  <g class="icon green" transform="translate(594 327) scale(0.75)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="small" x="620" y="340">Verifier</text>
  <rect class="box amber" x="208" y="104" width="344" height="80" rx="8"/>
  <g class="icon amber" transform="translate(222 115) scale(0.75)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name" x="248" y="128">Door 1: the login page</text>
  <rect class="chip amber" x="224" y="144" width="101" height="26" rx="13"/>
  <text class="small mid" x="274.5" y="161">Web Bot Auth</text>
  <rect class="chip amber" x="333" y="144" width="75" height="26" rx="13"/>
  <text class="small mid" x="370.5" y="161">Passkeys</text>
  <g class="line"><path d="M176 144H208" marker-end="url(#agent-doors-a-arrow)"/></g>
  <g class="line"><path d="M552 144H584" marker-end="url(#agent-doors-a-arrow)"/></g>
  <rect class="box amber" x="208" y="200" width="344" height="80" rx="8"/>
  <g class="icon amber" transform="translate(222 211) scale(0.75)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="248" y="224">Door 2: delegated tokens</text>
  <rect class="chip amber" x="224" y="240" width="56" height="26" rx="13"/>
  <text class="small mid" x="252" y="257">OAuth</text>
  <rect class="chip amber" x="288" y="240" width="114" height="26" rx="13"/>
  <text class="small mid" x="345" y="257">Token exchange</text>
  <rect class="chip amber" x="410" y="240" width="43" height="26" rx="13"/>
  <text class="small mid" x="431.5" y="257">XAA</text>
  <g class="line"><path d="M176 240H208" marker-end="url(#agent-doors-a-arrow)"/></g>
  <g class="line"><path d="M552 240H584" marker-end="url(#agent-doors-a-arrow)"/></g>
  <rect class="box amber" x="208" y="296" width="344" height="80" rx="8"/>
  <g class="icon amber" transform="translate(222 307) scale(0.75)"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
  <text class="name" x="248" y="320">Door 3: credentials</text>
  <rect class="chip amber" x="224" y="336" width="165" height="26" rx="13"/>
  <text class="small mid" x="306.5" y="353">Verifiable credentials</text>
  <rect class="chip amber" x="397" y="336" width="82" height="26" rx="13"/>
  <text class="small mid" x="438" y="353">OpenID4VP</text>
  <g class="line"><path d="M176 336H208" marker-end="url(#agent-doors-a-arrow)"/></g>
  <g class="line"><path d="M552 336H584" marker-end="url(#agent-doors-a-arrow)"/></g>
  <g class="line"><path d="M108 392V408"/></g>
  <g class="line"><path d="M652 392V408"/></g>
  <rect class="key" x="24" y="408" width="712" height="56" rx="8"/>
  <text class="name" x="40" y="430">Under every door: the user stays in control</text>
  <text class="small" x="40" y="450">Consent, scoped tokens and revocation work the same way whichever door an agent uses</text>
</svg>
