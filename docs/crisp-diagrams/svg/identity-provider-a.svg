<svg xmlns="http://www.w3.org/2000/svg" width="760" height="696" viewBox="0 0 760 696" role="img" aria-label="Every sign-in passes a risk check before the identity provider issues tokens">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="identity-provider-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every sign-in passes a risk check before the identity provider issues tokens</text>
  <text class="note" x="24" y="54">The parts of a customer identity provider behind the login page</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
  <text class="name" x="258" y="100">Your apps</text>
  <text class="note" x="258" y="116">Web, mobile and partner portals send users here</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#identity-provider-a-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#identity-provider-a-arrow)"/></g>
  <text class="note end" x="332" y="156">sign-in requests</text>
  <text class="note" x="428" y="156">ID and access tokens</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="344" rx="8"/>
  <text class="name" x="40" y="196">Identity provider</text>
  <rect class="key" x="40" y="212" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 222) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text class="name" x="82" y="236">Risk check</text>
  <text x="166" y="236">scores each attempt; risky ones need a second factor</text>
  <rect class="box teal" x="40" y="268" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="52" y="280" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 286) scale(0.833333)"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></g>
  <text class="name" x="52" y="332">Login page</text>
  <text class="note" x="52" y="348">One sign-in screen for every app</text>
  <rect class="box teal" x="272" y="268" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="284" y="280" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(290 286) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="284" y="332">User store</text>
  <text class="note" x="284" y="348">Profiles, passwords and passkeys</text>
  <rect class="box teal" x="504" y="268" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="516" y="280" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(522 286) scale(0.833333)"><path d="M7 11a5 5 0 0 1 10 0c0 3-.5 5.5-1.5 7.5"/><path d="M9.5 11a2.5 2.5 0 0 1 5 0c0 3.5-.8 6-2 8.5"/><path d="M12 11c0 3-.6 6-2 9"/><path d="M4.5 14c-.3-1-.5-2-.5-3a8 8 0 0 1 14.5-4.6"/><path d="M7 18.5c.7-1.2 1-2.6 1-4"/></g>
  <text class="name" x="516" y="332">MFA</text>
  <text class="note" x="516" y="348">Push, codes and passkeys as a</text>
  <text class="note" x="516" y="364">second factor</text>
  <rect class="box teal" x="40" y="392" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="52" y="404" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 410) scale(0.833333)"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g>
  <text class="name" x="52" y="456">Connections</text>
  <text class="note" x="52" y="472">Google, Apple and company SSO</text>
  <rect class="box teal" x="272" y="392" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="284" y="404" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(290 410) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="284" y="456">Token service</text>
  <text class="note" x="284" y="472">Issues ID, access and refresh</text>
  <text class="note" x="284" y="488">tokens</text>
  <rect class="box teal" x="504" y="392" width="216" height="108" rx="8"/>
  <rect class="badge teal" x="516" y="404" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(522 410) scale(0.833333)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></g>
  <text class="name" x="516" y="456">Audit log</text>
  <text class="note" x="516" y="472">Who signed in, from where, and</text>
  <text class="note" x="516" y="488">how</text>
  <g class="line"><path d="M132 516V564" marker-end="url(#identity-provider-a-arrow)"/></g>
  <rect class="box green" x="24" y="564" width="216" height="108" rx="8"/>
  <rect class="badge green" x="36" y="576" width="32" height="32" rx="9"/><g class="icon green" transform="translate(42 582) scale(0.833333)"><path d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-.8 2.5-2.5 2.5 1.7 0 2.5 1.3 2.5 2.5V17c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v2.5c0 1.2.8 2.5 2.5 2.5-1.7 0-2.5 1.3-2.5 2.5V17c0 2-1 3-3 3"/></g>
  <text class="name" x="36" y="628">Your APIs</text>
  <text class="note" x="36" y="644">Check the access token on every</text>
  <text class="note" x="36" y="660">call</text>
  <g class="line"><path d="M380 516V564" marker-end="url(#identity-provider-a-arrow)"/></g>
  <rect class="box green" x="272" y="564" width="216" height="108" rx="8"/>
  <rect class="badge green" x="284" y="576" width="32" height="32" rx="9"/><g class="icon green" transform="translate(290 582) scale(0.833333)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></g>
  <text class="name" x="284" y="628">CRM</text>
  <text class="note" x="284" y="644">Gets profile updates as they</text>
  <text class="note" x="284" y="660">happen</text>
  <g class="line"><path d="M628 516V564" marker-end="url(#identity-provider-a-arrow)"/></g>
  <rect class="box green" x="520" y="564" width="216" height="108" rx="8"/>
  <rect class="badge green" x="532" y="576" width="32" height="32" rx="9"/><g class="icon green" transform="translate(538 582) scale(0.833333)"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></g>
  <text class="name" x="532" y="628">Security team</text>
  <text class="note" x="532" y="644">Gets alerts on suspicious</text>
  <text class="note" x="532" y="660">sign-ins</text>
  <text class="note" x="388" y="544">tokens and events</text>
</svg>
