  <rect class="box teal" x="388" y="336" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="400" y="348" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(406 354) scale(0.833333)"><path d="M4 5.5h16v10H10l-4 3.5v-3.5H4z"/></g>
  <text class="name" x="400" y="400">Conversation memory</text>
