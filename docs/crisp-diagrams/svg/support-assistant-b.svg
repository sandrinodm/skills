  <rect class="badge teal" x="52" y="348" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 354) scale(0.833333)"><path d="M12 4v16M7 20h10M5 7h14M7.5 7L4.5 13a3 3 0 0 0 6 0zM16.5 7l-3 6a3 3 0 0 0 6 0z"/></g>
