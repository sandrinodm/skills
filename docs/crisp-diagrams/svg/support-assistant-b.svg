  <rect class="badge green" x="532" y="560" width="32" height="32" rx="9"/><g class="icon green" transform="translate(538 566) scale(0.833333)"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5.5A1.5 1.5 0 0 1 4 17.5zM20 14h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5zM17 19c0 1.5-2 2.5-5 2.5"/></g>
