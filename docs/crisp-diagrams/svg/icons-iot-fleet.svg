<svg xmlns="http://www.w3.org/2000/svg" width="760" height="648" viewBox="0 0 760 648" role="img" aria-label="Every device in the fleet signs in with its own certificate">
  <style>
/* crisp-diagrams theme: pastel: flat soft fills per group. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--blue:#dfeafc;--blue-line:#93b8ec;--green:#dcf1e3;--green-line:#8fcaa1;--violet:#e9e3fb;--violet-line:#b4a3ec;--amber:#fcecd0;--amber-line:#e3b766;--rose:#fbe1e7;--rose-line:#e89fb0;--teal:#d8f0ee;--teal-line:#84c7c1;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b;--blue-ink:#2f6db5;--green-ink:#2f7d4f;--violet-ink:#6450b8;--amber-ink:#94620f;--rose-ink:#b04760;--teal-ink:#1f7a73}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#7a7872;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--blue:#1f3350;--blue-line:#4a76b0;--green:#1e3a2a;--green-line:#4c8a60;--violet:#2f2a50;--violet-line:#7464b4;--amber:#3e3120;--amber-line:#a07e45;--rose:#3f2532;--rose-line:#a65b72;--teal:#1a3a38;--teal-line:#3e908a;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505;--blue-ink:#8fb8ef;--green-ink:#8fd0a6;--violet-ink:#b6a8f0;--amber-ink:#e6bd73;--rose-ink:#eda3b4;--teal-ink:#85d0c8}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:var(--paper);stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.box.zone{fill:none}
.box.blue,.chip.blue{fill:var(--blue);stroke:var(--blue-line)}
.box.green,.chip.green{fill:var(--green);stroke:var(--green-line)}
.box.violet,.chip.violet{fill:var(--violet);stroke:var(--violet-line)}
.box.amber,.chip.amber{fill:var(--amber);stroke:var(--amber-line)}
.box.rose,.chip.rose{fill:var(--rose);stroke:var(--rose-line)}
.box.teal,.chip.teal{fill:var(--teal);stroke:var(--teal-line)}
.box.zone.blue{fill:none;stroke:var(--blue-line)}
.box.zone.green{fill:none;stroke:var(--green-line)}
.box.zone.violet{fill:none;stroke:var(--violet-line)}
.box.zone.amber{fill:none;stroke:var(--amber-line)}
.box.zone.rose{fill:none;stroke:var(--rose-line)}
.box.zone.teal{fill:none;stroke:var(--teal-line)}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.device.blue{fill:var(--blue);stroke:var(--blue-line)}
.device.green{fill:var(--green);stroke:var(--green-line)}
.device.violet{fill:var(--violet);stroke:var(--violet-line)}
.device.amber{fill:var(--amber);stroke:var(--amber-line)}
.device.rose{fill:var(--rose);stroke:var(--rose-line)}
.device.teal{fill:var(--teal);stroke:var(--teal-line)}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
.badge.blue{fill:var(--paper);stroke:var(--blue-line);stroke-width:1}
.icon.blue{stroke:var(--blue-ink)}
.badge.green{fill:var(--paper);stroke:var(--green-line);stroke-width:1}
.icon.green{stroke:var(--green-ink)}
.badge.violet{fill:var(--paper);stroke:var(--violet-line);stroke-width:1}
.icon.violet{stroke:var(--violet-ink)}
.badge.amber{fill:var(--paper);stroke:var(--amber-line);stroke-width:1}
.icon.amber{stroke:var(--amber-ink)}
.badge.rose{fill:var(--paper);stroke:var(--rose-line);stroke-width:1}
.icon.rose{stroke:var(--rose-ink)}
.badge.teal{fill:var(--paper);stroke:var(--teal-line);stroke-width:1}
.icon.teal{stroke:var(--teal-ink)}
</style>
  <defs>
    <marker id="icons-iot-fleet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every device in the fleet signs in with its own certificate</text>
  <text class="note" x="24" y="54">The parts of a platform that manages connected devices</text>
  <rect class="box violet" x="200" y="76" width="360" height="56" rx="8"/>
  <rect class="badge violet" x="214" y="88" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(220 94) scale(0.833333)"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .3 5 2.5 5 5.8"/></g>
  <text class="name" x="258" y="100">Field technicians</text>
  <text class="note" x="258" y="116">Install, check and replace devices</text>
  <g class="line"><path d="M340 132V172" marker-end="url(#icons-iot-fleet-arrow)"/></g>
  <g class="line"><path d="M420 172V132" marker-end="url(#icons-iot-fleet-arrow)"/></g>
  <text class="note end" x="332" y="156">installs and checks</text>
  <text class="note" x="428" y="156">device status</text>
  <rect class="box zone teal" x="24" y="172" width="712" height="312" rx="8"/>
  <text class="name" x="40" y="196">Device platform</text>
  <rect class="box teal" x="40" y="212" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="52" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 230) scale(0.833333)"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
  <text class="name" x="52" y="276">Device registry</text>
  <text class="note" x="52" y="292">Every device, its owner and location</text>
  <rect class="box teal" x="388" y="212" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="400" y="224" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(406 230) scale(0.833333)"><path d="M4 20V4M4 20h16M8.5 16.5v-4M12.5 16.5V8M16.5 16.5v-6"/></g>
  <text class="name" x="400" y="276">Telemetry</text>
  <text class="note" x="400" y="292">Readings from each sensor</text>
  <rect class="box teal" x="40" y="320" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="52" y="332" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(58 338) scale(0.833333)"><path d="M12 4v12M7 11l5 5 5-5M4 16v4h16v-4"/></g>
  <text class="name" x="52" y="384">Updates</text>
  <text class="note" x="52" y="400">Firmware rolled out in waves</text>
  <rect class="box teal" x="388" y="320" width="332" height="92" rx="8"/>
  <rect class="badge teal" x="400" y="332" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(406 338) scale(0.833333)"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g>
  <text class="name" x="400" y="384">Alerts</text>
  <text class="note" x="400" y="400">Offline or unusual devices</text>
  <rect class="key" x="40" y="428" width="680" height="40" rx="8"/>
  <g class="icon accent" transform="translate(54 438) scale(0.833333)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/></g>
  <text class="name" x="82" y="452">Device identity</text>
  <text x="200" y="452">each device proves who it is with its own certificate</text>
  <g class="line"><path d="M132 468V532" marker-end="url(#icons-iot-fleet-arrow)"/></g>
  <rect class="box green" x="24" y="532" width="216" height="92" rx="8"/>
  <rect class="badge green" x="36" y="544" width="32" height="32" rx="9"/><g class="icon green" transform="translate(42 550) scale(0.833333)"><path d="M3 9.5a13 13 0 0 1 18 0M6 13a8.5 8.5 0 0 1 12 0M9 16.5a4 4 0 0 1 6 0M12 19.5v.2"/></g>
  <text class="name" x="36" y="596">Sensors in the field</text>
  <text class="note" x="36" y="612">Meters, cameras and gateways</text>
  <g class="line"><path d="M380 468V532" marker-end="url(#icons-iot-fleet-arrow)"/></g>
  <rect class="box green" x="272" y="532" width="216" height="92" rx="8"/>
  <rect class="badge green" x="284" y="544" width="32" height="32" rx="9"/><g class="icon green" transform="translate(290 550) scale(0.833333)"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text class="name" x="284" y="596">Data lake</text>
  <text class="note" x="284" y="612">Long-term history</text>
  <g class="line"><path d="M628 468V532" marker-end="url(#icons-iot-fleet-arrow)"/></g>
  <rect class="box green" x="520" y="532" width="216" height="92" rx="8"/>
  <rect class="badge green" x="532" y="544" width="32" height="32" rx="9"/><g class="icon green" transform="translate(538 550) scale(0.833333)"><rect x="3" y="3.5" width="18" height="12" rx="1.5"/><path d="M12 15.5v4M8 20.5h8"/></g>
  <text class="name" x="532" y="596">Ops dashboard</text>
  <text class="note" x="532" y="612">Fleet health at a glance</text>
  <text class="note" x="388" y="512">signed traffic only</text>
</svg>
