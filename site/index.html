<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandrino's Skills</title>
  <meta name="description" content="Agent skills for Codex, Claude Code, and other agents that read SKILL.md files. Each one installs with a single command.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='2' fill='%231b1d22' transform='rotate(-6 16 16)'/%3E%3Ctext x='16' y='20.5' font-family='Arial,sans-serif' font-weight='700' font-size='12' fill='%23efefe8' text-anchor='middle' transform='rotate(-6 16 16)'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #e1e4e8;
      --surface: #f0f1f3;
      --ink: #16181d;
      --muted: #59606b;
      --line: #c8ccd2;
      --tape: #1b1d22;
      --tape-ink: #efefe8;
      --focus: #2747d0;
      --display: "Archivo", system-ui, sans-serif;
      --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #121418;
        --surface: #1a1d22;
        --ink: #e5e7ea;
        --muted: #979ea8;
        --line: #2b2f36;
        --tape: #2b2e35;
        --focus: #8ea2ff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.55 var(--display);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .page { max-width: 920px; margin: 0 auto; padding: 40px 16px 64px; }

    /* Label-maker tape: the page's one signature element. */
    .tape {
      display: inline-block;
      margin: 0;
      padding: .38em .75em .32em;
      background: linear-gradient(180deg, rgb(255 255 255 / .1), rgb(0 0 0 / .16)), var(--tape);
      color: var(--tape-ink);
      font-family: var(--display);
      font-size: 17px;
      font-stretch: 62%;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .09em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgb(0 0 0 / .55), 0 -1px 0 rgb(255 255 255 / .16);
      white-space: nowrap;
      border-radius: 2px;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .1), 0 1px 1px rgb(0 0 0 / .2), 0 4px 10px -6px rgb(0 0 0 / .45);
      transform: rotate(var(--tilt, 0deg));
    }

    .tape .ch { display: inline-block; white-space: pre; transform: translateY(var(--dy, 0)); }

    @media (prefers-color-scheme: dark) {
      .tape { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07), 0 4px 10px -6px rgb(0 0 0 / .8); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .tape.punch .ch {
        animation: punch 240ms cubic-bezier(.2, .8, .3, 1.25) backwards;
        animation-delay: calc(var(--i) * 32ms);
      }

      @keyframes punch {
        from { opacity: 0; transform: translateY(var(--dy, 0)) scale(.5); }
      }
    }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .masthead .tape { font-size: clamp(22px, 3.4vw, 30px); --tilt: -1.4deg; }
    .repo-link { font-size: 15px; font-weight: 500; }

    .lede {
      max-width: 44ch;
      margin: 56px 0 0;
      font-size: clamp(18px, 2vw, 21px);
      line-height: 1.45;
    }

    .lede code { font-family: var(--mono); font-size: .8em; font-stretch: 75%; }

    .command {
      margin: 24px 0 0;
      font-family: var(--mono);
      font-size: clamp(15px, 1.75vw, 23px);
      font-stretch: 75%;
      line-height: 2;
    }

    .command .prompt { margin-right: .4ch; color: var(--muted); user-select: none; }
    .command .token { white-space: nowrap; }

    .command .tape {
      margin-left: .1ch;
      font-size: .9em;
      letter-spacing: .05em;
      text-transform: none;
      vertical-align: .06em;
      --tilt: -.8deg;
    }

    /* On phones the command wraps; keep the label on its own line so cycling names never reflow the page. */
    @media (max-width: 719px) {
      .command .tape { display: table; margin: 4px 0 0; font-size: 1em; }
    }

    .catalog { margin-top: 88px; }

    .catalog-head {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-stretch: 75%;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .skills { display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; margin: 40px 0 0; padding: 0; list-style: none; }

    .skill {
      padding: 0 20px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    /* Pull the tape halfway over the card's top edge, as if stuck on. */
    .skill .tape { margin: -15px 0 0 -4px; }

    .skill-summary { max-width: 62ch; margin: 14px 0 0; }

    .skill-trigger {
      max-width: 82ch;
      margin: 12px 0 0;
      color: var(--muted);
      font: 400 12.5px/1.7 var(--mono);
      font-stretch: 75%;
    }

    .skill-trigger .key { color: var(--ink); }

    .skill-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin-top: 18px;
    }

    .install {
      display: flex;
      flex: 1 1 360px;
      min-width: 0;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .install code {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      overflow-x: auto;
      font: 400 13px/1.5 var(--mono);
      font-stretch: 75%;
      white-space: nowrap;
    }

    .copy {
      flex: none;
      min-width: 5.5em;
      padding: 0 16px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--line);
      font: 600 14px var(--display);
      cursor: pointer;
    }

    .copy:hover { background: var(--surface); }
    .copy:focus-visible { outline-offset: -3px; }
    .copy[data-state="done"] { color: var(--focus); }

    .source { font-size: 15px; font-weight: 500; white-space: nowrap; }

    .footer { margin-top: 80px; color: var(--muted); font-size: 14px; }

    @media (min-width: 720px) {
      .page { padding: 56px 32px 96px; }
      .skill { padding: 0 28px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="tape">Sandrino's skills</h1>
      <a class="repo-link" href="https://github.com/{{repo}}">View on GitHub</a>
    </header>

    <main>
      <p class="lede">Agent skills for Codex, Claude Code, and other agents that read <code>SKILL.md</code> files. Each one installs with a single command:</p>
      <p class="command">
        <span class="prompt" aria-hidden="true">$</span>{{command_prefix}}
        <span class="sr-only">&lt;skill-name&gt;</span><span class="tape" id="slot" aria-hidden="true">{{first_slug}}</span>
      </p>

      <section class="catalog" aria-labelledby="catalog-head">
        <h2 class="catalog-head" id="catalog-head">{{count}}</h2>
        <ul class="skills">{{skills}}
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>Installs use the <a href="https://skills.sh">skills.sh</a> CLI. Source and issues live on <a href="https://github.com/{{repo}}">GitHub</a>.</p>
    </footer>
  </div>

  <p class="sr-only" id="copy-status" aria-live="polite"></p>

  <script>
    const slotSkills = {{slot_json}};
    const jitter = [-0.04, 0.03, 0, 0.05, -0.02, 0.02, -0.05, 0.01];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Split a tape's text into letters with a slight vertical wobble, like embossed label tape.
    function emboss(tape, text, punch) {
      const letters = document.createElement('span');
      letters.setAttribute('aria-hidden', 'true');
      [...text].forEach((char, i) => {
        const ch = document.createElement('span');
        ch.className = 'ch';
        ch.textContent = char;
        ch.style.setProperty('--i', i);
        ch.style.setProperty('--dy', `${jitter[i % jitter.length]}em`);
        letters.append(ch);
      });
      const label = document.createElement('span');
      label.className = 'sr-only';
      label.textContent = text;
      tape.replaceChildren(label, letters);
      if (punch) {
        tape.classList.remove('punch');
        void tape.offsetWidth;
        tape.classList.add('punch');
      }
    }

    const title = document.querySelector('.masthead .tape');
    emboss(title, title.textContent, true);
    document.querySelectorAll('.skill .tape').forEach((tape) => emboss(tape, tape.textContent, false));

    const slot = document.getElementById('slot');
    let current = 0;
    function showSlot(punch) {
      const { slug, color } = slotSkills[current];
      if (color) slot.style.setProperty('--tape', color);
      else slot.style.removeProperty('--tape');
      emboss(slot, slug, punch);
    }

    if (slotSkills.length) {
      showSlot(false);
      if (!reducedMotion) {
        setTimeout(() => showSlot(true), 450);
        if (slotSkills.length > 1) {
          setInterval(() => {
            current = (current + 1) % slotSkills.length;
            showSlot(true);
          }, 2800);
        }
      }
    }

    const status = document.getElementById('copy-status');
    function flash(button, label, message) {
      button.querySelector('.copy-label').textContent = label;
      button.dataset.state = 'done';
      status.textContent = message;
      clearTimeout(button.resetTimer);
      button.resetTimer = setTimeout(() => {
        button.querySelector('.copy-label').textContent = 'Copy';
        delete button.dataset.state;
      }, 1800);
    }

    document.addEventListener('click', async (event) => {
      const button = event.target.closest('.copy');
      if (!button) return;
      const code = button.previousElementSibling;
      try {
        await navigator.clipboard.writeText(code.textContent);
        flash(button, 'Copied', `Copied ${code.textContent}`);
      } catch {
        getSelection().selectAllChildren(code);
        flash(button, 'Selected', 'Clipboard access is blocked. The command is selected, so copy it with your keyboard.');
      }
    });
  </script>
</body>
</html>
