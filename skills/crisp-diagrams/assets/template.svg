<svg xmlns="http://www.w3.org/2000/svg" width="760" height="HEIGHT" viewBox="0 0 760 HEIGHT" role="img" aria-label="TITLE">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <!-- Prefix the id with the diagram's name so two diagrams inlined on one page don't collide. -->
    <marker id="NAME-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">TITLE: the takeaway, as a sentence</text>
  <text class="note" x="24" y="54">Subtitle: what the diagram shows, or its scope</text>

  <!-- Content starts at y=72. Examples of each building block:

  Mark groups on every diagram (the quiet theme ignores the marks; colorful themes color them):
  <rect class="box zone teal" .../>  a container enclosing one group
  <rect class="box teal" .../>       a part of that group; parts of the same kind share a hue
  Hues: violet, teal, green, amber, rose (and blue last, since blue is the accent's color).

  A box with a name and two note lines (216 wide fits ~28 name / ~32 note characters per line):
  <rect class="box" x="24" y="72" width="216" height="72" rx="8"/>
  <text class="name" x="36" y="96">Name of the part</text>
  <text class="note" x="36" y="112">First line of what it does</text>
  <text class="note" x="36" y="128">second line, no period</text>

  The one accent (the idea to remember): same geometry, class "key"; text inside uses ink, not quiet:
  <rect class="key" x="24" y="160" width="712" height="40" rx="8"/>
  <text class="name" x="40" y="184">Guard</text>

  A chip (a named standard, product or example), 26 tall, rx 13, ~12px padding each side:
  <rect class="chip" x="24" y="216" width="82" height="26" rx="13"/>
  <text class="small mid" x="65" y="233">MCP server</text>

  An arrow (orthogonal only), with a quiet label 8px beside it:
  <g class="line"><path d="M380 250V290" marker-end="url(#NAME-arrow)"/></g>
  <text class="note" x="388" y="274">what moves along it</text>

  A sequence lifeline: <g class="life"><line x1="104" x2="104" y1="124" y2="484"/></g>
  A takeaway band at the bottom: <rect class="callout" x="24" y="Y" width="712" height="56" rx="8"/>
  -->
</svg>
