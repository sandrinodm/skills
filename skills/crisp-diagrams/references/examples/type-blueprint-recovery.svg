<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-label="Account recovery stalls backstage, where a person checks every ID by hand">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="blueprint-recovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Account recovery stalls backstage, where a person checks every ID by hand</text>
  <text class="note" x="24" y="54">Service blueprint for recovering a locked account</text>
  <text class="name" x="24" y="120">Customer</text>
  <text class="name" x="24" y="204">Frontstage</text>
  <g class="line"><path d="M24 164H736"/></g>
  <text class="note" x="24" y="157">line of interaction</text>
  <text class="name" x="24" y="288">Backstage</text>
  <g class="life"><path d="M24 248H736"/></g>
  <text class="note" x="24" y="241">line of visibility</text>
  <text class="name" x="24" y="372">Support systems</text>
  <g class="line"><path d="M24 332H736"/></g>
  <text class="note" x="24" y="325">internal line</text>
  <rect class="box violet" x="164" y="92" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="216.4" y="120">Can't sign in</text>
  <rect class="box teal" x="164" y="176" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="216.4" y="204">Recovery page</text>
  <rect class="box green" x="164" y="344" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="216.4" y="364">Account</text>
  <text class="small mid" x="216.4" y="380">database</text>
  <rect class="box violet" x="280.8" y="92" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="333.2" y="120">Asks for help</text>
  <rect class="box teal" x="280.8" y="176" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="333.2" y="204">Support chat</text>
  <rect class="box amber" x="280.8" y="260" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="333.2" y="288">Opens a ticket</text>
  <rect class="box green" x="280.8" y="344" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="333.2" y="372">Ticket system</text>
  <rect class="box violet" x="397.6" y="92" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="450" y="120">Uploads ID</text>
  <rect class="box teal" x="397.6" y="176" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="450" y="204">Upload screen</text>
  <rect class="key" x="397.6" y="260" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="450" y="280">Checks ID by</text>
  <text class="small mid" x="450" y="296">hand</text>
  <rect class="box green" x="397.6" y="344" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="450" y="364">ID check</text>
  <text class="small mid" x="450" y="380">vendor</text>
  <rect class="box violet" x="514.4" y="92" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="566.8" y="120">Waits a day</text>
  <rect class="box amber" x="514.4" y="260" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="566.8" y="288">Approves reset</text>
  <rect class="box green" x="514.4" y="344" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="566.8" y="364">Account</text>
  <text class="small mid" x="566.8" y="380">database</text>
  <rect class="box violet" x="631.2" y="92" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="683.6" y="120">Signs in again</text>
  <rect class="box teal" x="631.2" y="176" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="683.6" y="204">New passkey</text>
  <rect class="box green" x="631.2" y="344" width="104.8" height="48" rx="8"/>
  <text class="small mid" x="683.6" y="364">Identity</text>
  <text class="small mid" x="683.6" y="380">provider</text>
  <g class="line"><path d="M216.4 140V176" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M216.4 224V344" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M333.2 140V176" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M333.2 224V260" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M333.2 308V344" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M450 140V176" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M450 224V260" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M450 308V344" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M566.8 140V260" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M566.8 308V344" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M683.6 140V176" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M683.6 224V344" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M268.8 116H280.8" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M385.6 116H397.6" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M502.4 116H514.4" marker-end="url(#blueprint-recovery-arrow)"/></g>
  <g class="line"><path d="M619.2 116H631.2" marker-end="url(#blueprint-recovery-arrow)"/></g>
</svg>
