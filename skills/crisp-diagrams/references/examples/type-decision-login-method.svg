<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-label="Offer a passkey first; fall back only when the device can&#x27;t use one">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="decision-login-method-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Offer a passkey first; fall back only when the device can't use one</text>
  <text class="note" x="24" y="54">Which sign-in method to show a returning customer</text>
  <rect class="box" x="24" y="86" width="300" height="44" rx="8"/>
  <text class="name mid" x="174" y="111">Does the device support passkeys?</text>
  <rect class="key" x="436" y="80" width="300" height="56" rx="8"/>
  <text class="name" x="448" y="104">Passkey</text>
  <text class="small" x="448" y="120">One tap with Face ID or a fingerprint</text>
  <g class="line"><path d="M324 108H436" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note mid" x="380" y="100">yes</text>
  <g class="line"><path d="M174 130V182" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note" x="182" y="160">no</text>
  <rect class="box" x="24" y="182" width="300" height="44" rx="8"/>
  <text class="name mid" x="174" y="207">Is our app installed?</text>
  <rect class="box teal" x="436" y="176" width="300" height="56" rx="8"/>
  <text class="name" x="448" y="200">Push approval</text>
  <text class="note" x="448" y="216">Approve the sign-in in the app</text>
  <g class="line"><path d="M324 204H436" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note mid" x="380" y="196">yes</text>
  <g class="line"><path d="M174 226V278" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note" x="182" y="256">no</text>
  <rect class="box" x="24" y="278" width="300" height="44" rx="8"/>
  <text class="name mid" x="174" y="303">Can we send SMS in their country?</text>
  <rect class="box amber" x="436" y="272" width="300" height="56" rx="8"/>
  <text class="name" x="448" y="296">SMS code</text>
  <text class="note" x="448" y="312">Six digits, valid for five minutes</text>
  <g class="line"><path d="M324 300H436" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note mid" x="380" y="292">yes</text>
  <rect class="box violet" x="436" y="368" width="300" height="56" rx="8"/>
  <text class="name" x="448" y="392">Email link</text>
  <text class="note" x="448" y="408">A one-time link to their inbox</text>
  <g class="line"><path d="M174 322V396H436" marker-end="url(#decision-login-method-arrow)"/></g>
  <text class="note" x="182" y="363">no</text>
</svg>
