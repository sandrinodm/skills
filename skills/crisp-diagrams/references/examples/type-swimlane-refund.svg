<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-label="Small refunds never wait for a person; large ones go to a support agent">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="swimlane-refund-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Small refunds never wait for a person; large ones go to a support agent</text>
  <text class="note" x="24" y="54">Who does what in the refund process</text>
  <rect class="box zone violet" x="24" y="72" width="712" height="92" rx="8"/>
  <rect class="badge violet" x="40" y="86" width="32" height="32" rx="9"/><g class="icon violet" transform="translate(46 92) scale(0.833333)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></g>
  <text class="name" x="40" y="140">Customer</text>
  <rect class="box zone teal" x="24" y="164" width="712" height="92" rx="8"/>
  <rect class="badge teal" x="40" y="178" width="32" height="32" rx="9"/><g class="icon teal" transform="translate(46 184) scale(0.833333)"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M3 12.5v3M21 12.5v3M9.5 13v1M14.5 13v1"/><circle cx="12" cy="3.5" r="1"/></g>
  <text class="name" x="40" y="232">Support bot</text>
  <rect class="box zone amber" x="24" y="256" width="712" height="92" rx="8"/>
  <rect class="badge amber" x="40" y="270" width="32" height="32" rx="9"/><g class="icon amber" transform="translate(46 276) scale(0.833333)"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5.5A1.5 1.5 0 0 1 4 17.5zM20 14h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5zM17 19c0 1.5-2 2.5-5 2.5"/></g>
  <text class="name" x="40" y="324">Agent</text>
  <rect class="box zone green" x="24" y="348" width="712" height="92" rx="8"/>
  <rect class="badge green" x="40" y="362" width="32" height="32" rx="9"/><g class="icon green" transform="translate(46 368) scale(0.833333)"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></g>
  <text class="name" x="40" y="416">Payments</text>
  <g class="line"><path d="M152 72V440"/></g>
  <rect class="box violet" x="164" y="94" width="92" height="48" rx="8"/>
  <text class="small mid" x="210" y="114">Asks for a</text>
  <text class="small mid" x="210" y="130">refund</text>
  <rect class="box teal" x="280" y="186" width="92" height="48" rx="8"/>
  <text class="small mid" x="326" y="206">Checks the</text>
  <text class="small mid" x="326" y="222">order</text>
  <rect class="box teal" x="396" y="186" width="92" height="48" rx="8"/>
  <text class="small mid" x="442" y="206">Approves</text>
  <text class="small mid" x="442" y="222">under €100</text>
  <rect class="key" x="396" y="278" width="92" height="48" rx="8"/>
  <text class="small mid" x="442" y="298">Reviews €100</text>
  <text class="small mid" x="442" y="314">or more</text>
  <rect class="box green" x="512" y="370" width="92" height="48" rx="8"/>
  <text class="small mid" x="558" y="398">Pays it back</text>
  <rect class="box violet" x="628" y="94" width="92" height="48" rx="8"/>
  <text class="small mid" x="674" y="122">Gets an email</text>
  <g class="line"><path d="M256 118H268V210H280" marker-end="url(#swimlane-refund-arrow)"/></g>
  <g class="line"><path d="M372 210H396" marker-end="url(#swimlane-refund-arrow)"/></g>
  <g class="line"><path d="M372 210H384V302H396" marker-end="url(#swimlane-refund-arrow)"/></g>
  <g class="line"><path d="M488 210H500V394H512" marker-end="url(#swimlane-refund-arrow)"/></g>
  <g class="line"><path d="M488 302H500V394H512" marker-end="url(#swimlane-refund-arrow)"/></g>
  <g class="line"><path d="M604 394H616V118H628" marker-end="url(#swimlane-refund-arrow)"/></g>
</svg>
