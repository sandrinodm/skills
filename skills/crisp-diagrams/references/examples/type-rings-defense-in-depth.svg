<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-label="An attacker has to get through five layers to reach the customer data">
  <style>
/* crisp-diagrams theme: quiet (default): outlines only, one blue accent. Swap themes with scripts/theme.py; never edit a diagram's colors by hand. */
svg{--ink:#0b0b0b;--quiet:#52514e;--edge:#c3c2b7;--grid:rgba(11,11,11,.1);--accent:#2a78d6;--tint:rgba(137,135,129,.15);--paper:#ffffff;--screen:#f7f6f3;--ui:#e4e2db;--island:#0b0b0b}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--quiet:#c3c2b7;--edge:#383835;--grid:rgba(255,255,255,.1);--accent:#3987e5;--tint:rgba(151,149,141,.15);--paper:#262624;--screen:#1b1b1a;--ui:#3d3c39;--island:#050505}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--ink)}
.title{font-size:15px;font-weight:600}
.name{font-weight:600}
.note{font-size:11.5px;fill:var(--quiet)}
.small{font-size:11.5px}
.strong{font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.line{fill:none;stroke:var(--edge);stroke-width:1.25}
.life{fill:none;stroke:var(--grid);stroke-width:1.25;stroke-dasharray:4 4}
.head{fill:var(--edge)}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.key{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.chip{fill:var(--tint);stroke:var(--edge);stroke-width:1}
.callout{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
/* device mockups and glyphs (references/visuals.md) */
.device{fill:var(--paper);stroke:var(--quiet);stroke-width:1.5}
.screen{fill:var(--screen)}
.ui{fill:var(--ui)}
.field{fill:var(--paper);stroke:var(--edge);stroke-width:1}
.btn{fill:var(--ink)}
.island{fill:var(--island)}
.glyph{fill:none;stroke:var(--quiet);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tick{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.uitext{font-size:10px}
.uinote{font-size:10px;fill:var(--quiet)}
.btn-text{font-size:10px;font-weight:600;fill:var(--paper)}
.inv{fill:var(--paper)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* icons (scripts/icons.py) */
.icon{fill:none;stroke:var(--quiet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.accent{stroke:var(--accent)}
.badge{fill:var(--tint)}
</style>
  <defs>
    <marker id="rings-defense-in-depth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">An attacker has to get through five layers to reach the customer data</text>
  <text class="note" x="24" y="54">Defense in depth for a web app</text>
  <circle class="box teal" cx="220" cy="264" r="184"/>
  <circle class="box teal" cx="220" cy="264" r="151"/>
  <circle class="box teal" cx="220" cy="264" r="118"/>
  <circle class="box teal" cx="220" cy="264" r="85"/>
  <circle class="box teal" cx="220" cy="264" r="52"/>
  <path class="key" fill-rule="evenodd" d="M102 264a118 118 0 1 0 236 0a118 118 0 1 0 -236 0ZM135 264a85 85 0 1 0 170 0a85 85 0 1 0 -170 0Z"/>
  <text class="name mid" x="220" y="101.5">Network</text>
  <text class="name mid" x="220" y="134.5">Device</text>
  <text class="name mid" x="220" y="167.5">Identity</text>
  <text class="name mid" x="220" y="200.5">Application</text>
  <text class="name mid" x="220" y="269">Data</text>
  <g class="line"><path d="M292.743 113.12H446"/></g>
  <path class="btn" d="M292.743 113.12m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/>
  <text class="small strong" x="456" y="117.12">Network</text>
  <text class="note" x="456" y="133.12">Firewall and DDoS protection at the edge</text>
  <g class="line"><path d="M292.698 150.84H446"/></g>
  <path class="btn" d="M292.698 150.84m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/>
  <text class="small strong" x="456" y="154.84">Device</text>
  <text class="note" x="456" y="170.84">Only managed laptops reach admin tools</text>
  <g class="line"><path d="M287.905 188.56H446"/></g>
  <path class="btn" d="M287.905 188.56m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/>
  <text class="small strong" x="456" y="192.56">Identity</text>
  <text class="note" x="456" y="208.56">Passkeys and short-lived tokens for everyone</text>
  <g class="line"><path d="M277.179 226.28H446"/></g>
  <path class="btn" d="M277.179 226.28m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/>
  <text class="small strong" x="456" y="230.28">Application</text>
  <text class="note" x="456" y="246.28">Each service checks permissions itself</text>
  <g class="line"><path d="M243.6 264H446"/></g>
  <path class="btn" d="M243.6 264m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"/>
  <text class="small strong" x="456" y="268">Data</text>
  <text class="note" x="456" y="284">Encrypted, with every read logged</text>
</svg>
